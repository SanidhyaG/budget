function exprCents(expr) {
  return String(expr || '').split('+').reduce((s, p) => {
    if (!p) return s;
    const [a, b] = p.split('.');
    return s + (parseInt(a || '0', 10) || 0) * 100 + (parseInt(((b || '') + '00').slice(0, 2), 10) || 0);
  }, 0);
}
function pressKey(expr, k) {
  const parts = expr.split('+');
  const last = parts[parts.length - 1];
  if (k === 'C') return '';
  if (k === 'back') return expr.slice(0, -1);
  if (k === '+') { if (!last || last === '.') return expr; return (last.endsWith('.') ? expr.slice(0, -1) : expr) + '+'; }
  if (k === '.') { if (last.indexOf('.') >= 0) return expr; return expr + (last ? '.' : '0.'); }
  // digits, including 00
  for (const ch of k) {
    const cur = expr.split('+').pop();
    const dot = cur.indexOf('.');
    if (dot >= 0 && cur.length - dot - 1 >= 2) break;            // two decimals at most
    if (dot < 0 && cur.replace(/^0+/, '').length >= 7) break;     // up to $9,999,999
    if (cur === '0') expr = expr.slice(0, -1);
    if (cur === '' && ch === '0' && k === '00') { expr += '0'; break; }
    expr += ch;
  }
  return expr;
}
const exprFromCents = (c) => (c % 100 === 0 ? String(c / 100) : (c / 100).toFixed(2));
function defaultAccount() {
  const D = derive();
  if (meta.lastAccount && D.accounts.some((a) => a.name === meta.lastAccount)) return meta.lastAccount;
  return D.accounts.length ? D.accounts[0].name : '';
}

/**
 * opts: { txn } to edit, { type } to add, { goal, dir } for goal mode.
 */
function openEntry(opts) {
  opts = opts || {};
  const D = derive();
  const tx = opts.txn || null;
  const st = {
    mode: tx ? 'edit' : 'add',
    type: tx ? tx.type : opts.goal ? 'save' : (opts.type || 'expense'),
    expr: tx ? exprFromCents(Math.abs(toCents(tx.amount))) : '',
    date: tx ? tx.date : today(),
    account: tx ? tx.account : defaultAccount(),
    toAccount: tx ? tx.toAccount : '',
    note: tx ? tx.note : '',
    category: tx ? tx.category : '',
    goal: tx ? tx.goal : opts.goal || '',
    dir: tx ? (toCents(tx.amount) < 0 ? 'out' : 'in') : (opts.dir || 'in'),
    saving: false
  };
  if (st.type === 'transfer' && !st.toAccount) st.toAccount = (D.accounts.find((a) => a.name !== st.account) || {}).name || '';
  let m;

  function chipsHTML() {
    const kind = st.type === 'income' ? 'income' : 'expense';
    const list = D.cats.filter((c) => c.kind === kind).slice().sort((a, b) => ((D.usage[b.name] || 0) - (D.usage[a.name] || 0)) || byOrder(a, b));
    if (st.mode === 'edit' && st.category && !list.some((c) => c.name === st.category)) list.unshift({ name: st.category, icon: '📦' });
    return '<div class="chips" role="group" aria-label="Category">' + list.map((c) => '<button type="button" class="chip" data-cat="' + esc(c.name) + '" aria-pressed="' + (st.mode === 'edit' && st.category === c.name) + '"><span class="e" aria-hidden="true">' + esc(c.icon || '📦') + '</span><span>' + esc(c.name) + '</span></button>').join('') + '</div>';
  }
  function datePill() {
    return '<label class="epill"><span class="k">Date</span><span id="e-date-label">' + esc(fdSmart(st.date)) + '</span><input type="date" id="e-date" value="' + esc(st.date) + '" aria-label="Date"></label>';
  }
  function draw() {
    let h = '<div class="grab"></div>';
    if (st.type === 'save') {
      h += '<div class="goalbox">' + esc(st.goal) + '</div><div class="seg" role="group" aria-label="Direction"><button type="button" data-dir="in" aria-pressed="' + (st.dir === 'in') + '">Add money</button><button type="button" data-dir="out" aria-pressed="' + (st.dir === 'out') + '">Take out</button></div>';
    } else {
      h += '<div class="seg" role="group" aria-label="Entry type">' + [['expense', 'Expense'], ['income', 'Income'], ['transfer', 'Transfer']].map(([k, l]) => '<button type="button" data-type="' + k + '" aria-pressed="' + (st.type === k) + '">' + l + '</button>').join('') + '</div>';
    }
    h += '<div class="amount" id="e-amount"><div class="expr" id="e-expr"></div><div class="big" id="e-big"></div></div><div class="pills">' + datePill();
    if (st.type === 'transfer') {
      h += '<button type="button" class="epill" data-pick="account"><span class="k">From</span><span>' + esc(st.account || 'Choose') + '</span></button>' +
        '<button type="button" class="epill" data-pick="toAccount"><span class="k">To</span><span>' + esc(st.toAccount || 'Choose') + '</span></button>';
    } else {
      h += '<button type="button" class="epill" data-pick="account" id="e-account"><span class="k">' + (st.type === 'save' ? (st.dir === 'in' ? 'From' : 'To') : 'Account') + '</span><span>' + esc(st.account || 'Choose') + '</span></button>';
    }
    h += '<button type="button" class="epill" data-note id="e-note"><span class="k">Note</span><span>' + esc(st.note || 'Add') + '</span></button></div>';
    if (st.type === 'expense' || st.type === 'income') h += chipsHTML();
    const err = '<div class="err" id="e-err" role="alert"></div>';
    if (st.mode === 'edit') {
      h += err + '<div class="btns"><button type="button" class="btn danger" data-del>Delete</button><button type="button" class="btn primary" data-save>Save changes</button></div>';
    } else if (st.type === 'transfer') {
      h += err + '<div class="btns"><button type="button" class="btn primary" data-save>Save transfer</button></div>';
    } else if (st.type === 'save') {
      h += err + '<div class="btns"><button type="button" class="btn primary" data-save>Save</button></div>';
    } else h += err;
    h += '<div class="keypad" role="group" aria-label="Keypad">' +
      ['1', '2', '3', 'back', '4', '5', '6', 'C', '7', '8', '9', '+', '00', '0', '.', ''].map((k) => k === '' ? '<span></span>' :
        '<button type="button" class="key' + (/^\d+$/.test(k) || k === '.' ? '' : ' op') + '" data-key="' + k + '" aria-label="' + ({ back: 'Backspace', C: 'Clear', '+': 'Plus', '.': 'Decimal point' }[k] || k) + '">' + ({ back: '⌫', C: 'C' }[k] || k) + '</button>').join('') + '</div>';
    m.sheet.innerHTML = h;
    drawAmount();
  }
  function drawAmount() {
    const c = exprCents(st.expr);
    $('#e-big', m.sheet).textContent = usd(c);
    $('#e-expr', m.sheet).textContent = st.expr.indexOf('+') >= 0 ? st.expr.split('+').join(' + ') : '';
  }
  function fail(msg) {
    const e = $('#e-err', m.sheet); if (e) e.textContent = msg; else showToast(msg, { ms: 2500 });
    const a = $('#e-amount', m.sheet); a.classList.remove('shake'); void a.offsetWidth; a.classList.add('shake');
  }
  function rowFrom(category) {
    const c = exprCents(st.expr);
    const base = tx ? Object.assign({}, tx) : { id: newId(), rid: '' };
    return Object.assign(base, {
      date: st.date, type: st.type, amount: (st.type === 'save' && st.dir === 'out' ? -c : c) / 100,
      category: st.type === 'expense' || st.type === 'income' ? category : '',
      account: st.account, toAccount: st.type === 'transfer' ? st.toAccount : '', goal: st.type === 'save' ? st.goal : '', note: st.note
    });
  }
  function save(category) {
    if (st.saving) return;
    const c = exprCents(st.expr);
    if (c <= 0) return fail('Type an amount first');
    if (!isDate(st.date)) return fail('Pick a date');
    if (!st.account) return fail('Add an account first, on the Accounts screen');
    if (st.type === 'transfer') { if (!st.toAccount) return fail('Choose where the money goes'); if (st.toAccount === st.account) return fail('From and To must be different accounts'); }
    if ((st.type === 'expense' || st.type === 'income') && !category) return fail('Pick a category');
    st.saving = true;
    const row = rowFrom(category);
    put('Transactions', row);
    meta.lastAccount = st.account; saveMeta();
    closeModal(m);
    if (st.mode === 'edit') showToast('Saved', { ms: 2000 });
    else if (st.type === 'transfer') showToast('Moved ' + usd(c) + ' to ' + st.toAccount, { undo: () => del('Transactions', row.id) });
    else if (st.type === 'save') showToast((st.dir === 'out' ? 'Took ' + usd(c) + ' out of ' : 'Added ' + usd(c) + ' to ') + st.goal, { undo: () => del('Transactions', row.id) });
    else showToast('Logged ' + usd(c) + ' for ' + category, { undo: () => del('Transactions', row.id) });
  }

  m = openModal('', {
    cls: 'entry', name: 'entry',
    onKey: (e) => {
      if (e.target.closest('input,textarea,select')) return false;
      if (e.ctrlKey || e.metaKey || e.altKey) return false;
      let k = null;
      if (/^[0-9]$/.test(e.key)) k = e.key;
      else if (e.key === '.' || e.key === ',' || e.key === 'Decimal') k = '.';
      else if (e.key === '+' || e.key === 'Add') k = '+';
      else if (e.key === 'Backspace') k = 'back';
      else if (e.key === 'Delete') k = 'C';
      else if (e.key === 'Enter') { if (st.mode === 'edit' || st.type === 'transfer' || st.type === 'save') { save(st.category); return true; } return false; }
      if (!k) return false;
      st.expr = pressKey(st.expr, k); drawAmount();
      return true;
    }
  });
  m.sheet.addEventListener('click', (e) => {
    const t = e.target;
    const key = t.closest('[data-key]');
    if (key) { st.expr = pressKey(st.expr, key.dataset.key); drawAmount(); const er = $('#e-err', m.sheet); if (er) er.textContent = ''; return; }
    const chip = t.closest('[data-cat]');
    if (chip) {
      if (st.mode === 'add') save(chip.dataset.cat);
      else { st.category = chip.dataset.cat; $$('.chip', m.sheet).forEach((b) => b.setAttribute('aria-pressed', String(b === chip))); }
      return;
    }
    const ty = t.closest('[data-type]');
    if (ty) { const was = st.type; st.type = ty.dataset.type; if (was !== st.type) { if (st.type === 'transfer' && !st.toAccount) st.toAccount = (D.accounts.find((a) => a.name !== st.account) || {}).name || ''; if ((was === 'expense') !== (st.type === 'expense')) st.category = ''; } draw(); return; }
    const dir = t.closest('[data-dir]');
    if (dir) { st.dir = dir.dataset.dir; draw(); return; }
    const pick = t.closest('[data-pick]');
    if (pick) { pickAccount(st[pick.dataset.pick], (name) => { st[pick.dataset.pick] = name; draw(); }); return; }
    if (t.closest('[data-note]')) { editNote(st.note, (v) => { st.note = v; draw(); }); return; }
    if (t.closest('[data-save]')) { save(st.category); return; }
    if (t.closest('[data-del]') && tx) {
      closeModal(m);
      del('Transactions', tx.id);
      showToast('Deleted', { undo: () => put('Transactions', tx) });
    }
  });
  m.sheet.addEventListener('click', (e) => {
    const inp = e.target.closest('input[type="date"]');
    if (inp && inp.showPicker) { try { inp.showPicker(); } catch (err) { /* not allowed here */ } }
  });
  m.sheet.addEventListener('change', (e) => {
    if (e.target.id === 'e-date' && isDate(e.target.value)) { st.date = e.target.value; $('#e-date-label', m.sheet).textContent = fdSmart(st.date); }
  });
  draw();
  return m;
}

function pickAccount(current, done) {

function editNote(cur, done) {
  const m = openModal('<h2>Note</h2><label class="field"><span>Note</span><input id="note-in" maxlength="500" value="' + esc(cur) + '" autofocus autocomplete="off"></label><div class="btns"><button class="btn primary" type="button" data-x>Done</button></div>', { cls: 'center', name: 'note' });

const opt = (v, label, sel) => '<option value="' + esc(v) + '"' + (v === sel ? ' selected' : '') + '>' + esc(label) + '</option>';
const field = (label, inner, hint) => '<label class="field"><span>' + esc(label) + '</span>' + inner + (hint ? '<span class="hint">' + hint + '</span>' : '') + '</label>';
const val = (m, id) => { const el = $('#' + id, m.sheet); return el ? el.value.trim() : ''; };
const setErr = (m, msg) => { $('.err', m.sheet).textContent = msg; };
function nameTaken(t, name, id) { return rowsOf(t).some((r) => r.id !== id && String(r.name).trim().toLowerCase() === name.toLowerCase()); }

function formCategory(cat) {
  const isNew = !cat;
  cat = cat || { id: newId(), name: '', kind: 'expense', budget: 0, icon: '', order: rowsOf('Categories').reduce((m, c) => Math.max(m, c.order || 0), 0) + 1 };
  const m = openModal('<h2>' + (isNew ? 'Add category' : 'Edit category') + '</h2>' +
    field('Name', '<input id="f-name" maxlength="60" value="' + esc(cat.name) + '" autocomplete="off"' + (isNew ? ' autofocus' : '') + '>') +
    '<div class="two">' + field('Icon', '<input id="f-icon" maxlength="8" value="' + esc(cat.icon) + '" placeholder="🛒">') +
    field('Kind', '<select id="f-kind">' + opt('expense', 'Spending', cat.kind) + opt('income', 'Income', cat.kind) + '</select>') + '</div>' +
    field('Monthly budget', '<input id="f-budget" inputmode="decimal" value="' + esc(isNum(cat.budget) && cat.budget ? centsInput(toCents(cat.budget)) : '') + '" placeholder="0">', 'Applies to every month. Leave blank for no budget.') +
    '<div class="err" role="alert"></div><div class="btns">' + (isNew ? '' : '<button class="btn danger" type="button" data-x="del">Delete</button>') + '<button class="btn primary" type="button" data-x="save">Save</button></div>', { name: 'form-category' });
  m.sheet.addEventListener('click', (e) => {
    const b = e.target.closest('[data-x]'); if (!b) return;
    if (b.dataset.x === 'del') {
      confirmBox('Delete ' + cat.name + '?', 'Past entries keep their names. The category just stops appearing as a choice.', 'Delete', () => { closeModal(m); del('Categories', cat.id); showToast('Category deleted'); }, { danger: true });
      return;
    }
    const name = val(m, 'f-name');
    const budget = parseMoney(val(m, 'f-budget'));
    if (!name) return setErr(m, 'Give it a name');
    if (nameTaken('Categories', name, cat.id)) return setErr(m, 'There is already a category with that name');
    if (Number.isNaN(budget) || (budget != null && budget < 0)) return setErr(m, 'Budget must be an amount like 250');
    const old = cat.name;
    closeModal(m);
    batch(() => {
      put('Categories', Object.assign({}, cat, { name, icon: val(m, 'f-icon'), kind: $('#f-kind', m.sheet).value, budget: (budget || 0) / 100 }));
      if (!isNew) cascade('category', old, name);
    });
  });
}

function formAccount(acc) {
  const D = derive();
  const isNew = !acc;
  acc = acc || { id: newId(), name: '', kind: 'bank', opening: 0, order: rowsOf('Accounts').reduce((m, a) => Math.max(m, a.order || 0), 0) + 1 };
  const balNow = isNew ? 0 : (D.bal[acc.name] || 0);
  const owed = acc.kind === 'credit';
  const m = openModal('<h2>' + (isNew ? 'Add account' : 'Edit account') + '</h2>' +
    field('Name', '<input id="f-name" maxlength="60" value="' + esc(acc.name) + '" autocomplete="off"' + (isNew ? ' autofocus' : '') + '>') +
    field('Kind', '<select id="f-kind">' + KINDS.map((k) => opt(k, KIND_LABEL[k], acc.kind)).join('') + '</select>') +
    field(owed ? 'Amount owed now' : 'Current balance', '<input id="f-bal" inputmode="decimal" value="' + esc(centsInput(owed ? -balNow : balNow)) + '" placeholder="0">',
      'What the account shows today. For a credit card, enter what you owe.') +
    '<div class="err" role="alert"></div><div class="btns">' + (isNew ? '' : '<button class="btn danger" type="button" data-x="del">Delete</button>') + '<button class="btn primary" type="button" data-x="save">Save</button></div>', { name: 'form-account' });
  m.sheet.addEventListener('change', (e) => {
    if (e.target.id === 'f-kind') $('#f-bal', m.sheet).closest('.field').firstChild.textContent = e.target.value === 'credit' ? 'Amount owed now' : 'Current balance';
  });
  m.sheet.addEventListener('click', (e) => {
    const b = e.target.closest('[data-x]'); if (!b) return;
    if (b.dataset.x === 'del') {
      confirmBox('Delete ' + acc.name + '?', 'Past entries keep their names. Its balance stops counting toward net worth.', 'Delete', () => { closeModal(m); del('Accounts', acc.id); }, { danger: true });
      return;
    }
    const name = val(m, 'f-name');
    const kind = $('#f-kind', m.sheet).value;
    let want = parseMoney(val(m, 'f-bal'));
    if (!name) return setErr(m, 'Give it a name');
    if (nameTaken('Accounts', name, acc.id)) return setErr(m, 'There is already an account with that name');
    if (Number.isNaN(want)) return setErr(m, 'Balance must be an amount like 1250.50');
    want = want || 0;
    if (kind === 'credit') want = -Math.abs(want);
    // Back-solve the opening balance from the balance the person sees today.
    const opening = toCents(acc.opening) + (want - balNow);
    const old = acc.name;
    closeModal(m);
    batch(() => {
      put('Accounts', Object.assign({}, acc, { name, kind, opening: (isNew ? want : opening) / 100 }));
      if (!isNew) cascade('account', old, name);
    });
  });
}

function formGoal(g) {

  g = g || { id: newId(), name: '', target: 0, targetDate: '', icon: '' };
  const m = openModal('<h2>' + (isNew ? 'Add goal' : 'Edit goal') + '</h2>' +
    field('Name', '<input id="f-name" maxlength="60" value="' + esc(g.name) + '" autocomplete="off"' + (isNew ? ' autofocus' : '') + '>') +
    '<div class="two">' + field('Target', '<input id="f-target" inputmode="decimal" value="' + esc(isNum(g.target) && g.target ? centsInput(toCents(g.target)) : '') + '">') +

  m.sheet.addEventListener('click', (e) => {
    const b = e.target.closest('[data-x]'); if (!b) return;
    if (b.dataset.x === 'del') {
      confirmBox('Delete ' + g.name + '?', 'Past entries keep their names. Money saved toward it stays in your accounts.', 'Delete', () => { closeModal(m); del('Goals', g.id); }, { danger: true });
      return;
    }
    const name = val(m, 'f-name'), target = parseMoney(val(m, 'f-target')), date = val(m, 'f-date');

    if (!target || Number.isNaN(target) || target <= 0) return setErr(m, 'Target must be an amount like 1500');

    closeModal(m);
    batch(() => {
      put('Goals', Object.assign({}, g, { name, target: target / 100, targetDate: isDate(date) ? date : '', icon: val(m, 'f-icon') }));
      if (!isNew) cascade('goal', old, name);
    });
  });
}

function formRecurring(rec) {
  const D = derive();
  const isNew = !rec;
  rec = rec || { id: newId(), name: '', type: 'expense', amount: 0, category: '', account: defaultAccount(), freq: 'monthly', anchor: today(), auto: false, loggedThrough: '' };
  const due = isNew ? rec.anchor : (nextDue(rec) || rec.anchor);
  const catOpts = (type, sel) => '<option value="">Choose</option>' + D.cats.filter((c) => c.kind === type).map((c) => opt(c.name, c.name, sel)).join('');
  const m = openModal('<h2>' + (isNew ? 'Add recurring item' : 'Edit recurring item') + '</h2>' +
    '<div class="seg" role="group" aria-label="Type"><button type="button" data-t="expense" aria-pressed="' + (rec.type === 'expense') + '">Bill</button><button type="button" data-t="income" aria-pressed="' + (rec.type === 'income') + '">Income</button></div>' +
    field('Name', '<input id="f-name" maxlength="60" value="' + esc(rec.name) + '" autocomplete="off" placeholder="Rent">') +
    '<div class="two">' + field('Amount', '<input id="f-amount" inputmode="decimal" value="' + esc(isNum(rec.amount) && rec.amount ? centsInput(toCents(rec.amount)) : '') + '">') +
    field('How often', '<select id="f-freq">' + FREQS.map((f) => opt(f, FREQ_LABEL[f], rec.freq)).join('') + '</select>') + '</div>' +
    '<div class="two">' + field('Category', '<select id="f-cat">' + catOpts(rec.type, rec.category) + '</select>') +
    field('Account', '<select id="f-acc">' + D.accounts.map((a) => opt(a.name, a.name, rec.account)).join('') + '</select>') + '</div>' +
    field(isNew ? 'First due' : 'Next due', '<input id="f-due" type="date" value="' + esc(due) + '">', isNew ? 'A date in the past logs or lists everything from then on (up to 90 days back).' : 'Changing this starts the schedule again from the new date.') +
    '<label class="toggle"><span>Log automatically when due<span class="hint" style="display:block;font-size:12px;color:var(--muted)">Otherwise it shows under Due soon with Paid and Skip.</span></span><input type="checkbox" id="f-auto"' + (rec.auto ? ' checked' : '') + '></label>' +
    '<div class="err" role="alert"></div><div class="btns">' + (isNew ? '' : '<button class="btn danger" type="button" data-x="del">Delete</button>') + '<button class="btn primary" type="button" data-x="save">Save</button></div>', { name: 'form-recurring' });
  let type = rec.type;
  m.sheet.addEventListener('click', (e) => {
    const t = e.target.closest('[data-t]');
    if (t) { type = t.dataset.t; $$('[data-t]', m.sheet).forEach((x) => x.setAttribute('aria-pressed', String(x === t))); $('#f-cat', m.sheet).innerHTML = catOpts(type, ''); return; }
    const b = e.target.closest('[data-x]'); if (!b) return;
    if (b.dataset.x === 'del') {
      confirmBox('Delete ' + rec.name + '?', 'Entries it already logged stay. Nothing new will be logged or listed.', 'Delete', () => { closeModal(m); del('Recurring', rec.id); }, { danger: true });
      return;
    }
    const name = val(m, 'f-name'), amount = parseMoney(val(m, 'f-amount')), d = val(m, 'f-due');
    if (!name) return setErr(m, 'Give it a name');
    if (!amount || Number.isNaN(amount) || amount <= 0) return setErr(m, 'Amount must be like 489 or 12.99');
    if (!isDate(d)) return setErr(m, 'Pick a due date');
    if (!val(m, 'f-acc')) return setErr(m, 'Add an account first');
    const row = Object.assign({}, rec, { name, type, amount: amount / 100, category: val(m, 'f-cat'), account: val(m, 'f-acc'), freq: val(m, 'f-freq'), auto: $('#f-auto', m.sheet).checked });
    // A new item, or a moved due date, restarts the schedule from that date.
    if (isNew || d !== due || row.freq !== rec.freq) { row.anchor = d; row.loggedThrough = addDays(d, -1); }
    closeModal(m);
    put('Recurring', row);
    if (meta.version) { runAutoLog(); }
  });
}

function currentLoan() { const D = derive(); return D.loans.find((l) => l.id === ui.loanId) || D.loans[0]; }

function formValue(title, label, cur, hint, onSave, opts) {
  opts = opts || {};
  const m = openModal('<h2>' + esc(title) + '</h2>' + field(label, '<input id="v-in" inputmode="decimal" value="' + esc(cur) + '" autofocus autocomplete="off">', hint) +
    '<div class="err" role="alert"></div><div class="btns">' + (opts.clear ? '<button class="btn" type="button" data-x="clear">Clear</button>' : '') + '<button class="btn primary" type="button" data-x="save">Save</button></div>', { cls: 'center', name: 'form-value' });
  const go2 = (clear) => {
    const raw = clear ? '' : val(m, 'v-in');
    const v = opts.number ? parseNumber(raw) : parseMoney(raw);
    if (Number.isNaN(v) || (v != null && v < 0)) return setErr(m, 'Enter a number like ' + (opts.example || '200'));
    if (v == null && !opts.clear) return setErr(m, 'Enter a number like ' + (opts.example || '200'));
    closeModal(m); onSave(v);
  };
  m.sheet.addEventListener('click', (e) => { const b = e.target.closest('[data-x]'); if (b) go2(b.dataset.x === 'clear'); });
  m.sheet.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); go2(false); } });
}

function setPlannedPayment(L, cents) {

  else put('Categories', { id: newId(), name: L.category || 'Education loan', kind: 'expense', budget: cents / 100, icon: '🎓', order: rowsOf('Categories').reduce((m, c) => Math.max(m, c.order || 0), 0) + 1 });
}

function formPayment(pay) {
  const D = derive();
  const L = pay ? (D.loans.find((l) => l.name === pay.loan) || currentLoan()) : currentLoan();
  const isNew = !pay;
  pay = pay || { id: newId(), date: today(), loan: L.name, usd: null, fee: null, provider: '', fx: null, inr: null, inrApplied: null, interest: null, principal: null, txnId: '', confirmed: false, note: '' };
  const linked = pay.txnId ? db.tables.Transactions[pay.txnId] : null;
  // Expenses that no payment links to yet, newest first.
  const free = D.txns.filter((t) => t.type === 'expense' && (!D.loanTxnIds[t.id] || t.id === pay.txnId)).slice(0, 80);
  const suggest = isNew ? free.find((t) => t.category === L.category && Math.abs(daysBetween(t.date, today())) <= 10) : null;
  const money = (v) => (isNum(v) ? centsInput(toCents(v)) : '');
  const num = (v) => (isNum(v) ? String(v) : '');
  const accOpts = D.accounts.map((a) => opt(a.name, a.name, linked ? linked.account : defaultAccount())).join('');
  const txOpt = (t) => opt(t.id, fd(t.date) + ', ' + usd(toCents(t.amount)) + ', ' + (t.category || 'Expense') + (t.note ? ', ' + t.note.slice(0, 30) : ''), pay.txnId || (suggest && suggest.id));
  let linkBlock;
  if (!isNew && linked) {
    linkBlock = '<p class="note-line" id="pf-linked">Linked to the ' + esc(usd(toCents(linked.amount))) + ' ' + esc(linked.category) + ' entry on ' + esc(fd(linked.date)) + '. Saving keeps its amount equal to the total above.</p>';
  } else {
    const mode = suggest ? 'link' : 'create';
    linkBlock = '<fieldset><legend>Budget entry</legend>' + (suggest ? '<p class="flag">You already logged ' + esc(usd(toCents(suggest.amount))) + ' for ' + esc(suggest.category) + ' on ' + esc(fd(suggest.date)) + '. Linking it avoids counting the payment twice.</p>' : '') +
      '<label class="radio"><input type="radio" name="pf-mode" value="create"' + (mode === 'create' ? ' checked' : '') + '><span>Add the total as an expense in ' + esc(L.category) + '<span class="hint" style="display:block;font-size:12px;color:var(--muted)">From the Paid from account</span></span></label>' +
      '<label class="radio"><input type="radio" name="pf-mode" value="link"' + (mode === 'link' ? ' checked' : '') + (free.length ? '' : ' disabled') + '><span>Link an expense already logged</span></label>' +
      '<div id="pf-txbox"' + (mode === 'link' ? '' : ' class="hidden"') + '>' + field('Expense to link', '<select id="pf-tx">' + free.map(txOpt).join('') + '</select>', 'Its amount is set to the total above when you save.') + '</div></fieldset>';
  }
  const m = openModal('<h2>' + (isNew ? 'Record a loan payment' : 'Loan payment') + '</h2>' +
    '<div class="two">' + field('Date', '<input id="pf-date" type="date" value="' + esc(pay.date) + '">') + field('Paid from', '<select id="pf-acc">' + accOpts + '</select>') + '</div>' +
    '<div class="two">' + field('USD sent', '<input id="pf-usd" inputmode="decimal" value="' + esc(money(pay.usd)) + '"' + (isNew ? ' autofocus' : '') + '>') +
    field('Fee, USD', '<input id="pf-fee" inputmode="decimal" value="' + esc(money(pay.fee)) + '" placeholder="0">') + '</div>' +
    '<div class="two">' + field('Provider', '<input id="pf-provider" maxlength="60" value="' + esc(pay.provider) + '" placeholder="For example, Wise">') +
    field('Provider rate, ₹ per $1', '<input id="pf-fx" inputmode="decimal" value="' + esc(num(pay.fx)) + '">') + '</div>' +
    field('INR received', '<input id="pf-inr" inputmode="decimal" value="' + esc(money(pay.inr)) + '">', 'From the provider receipt. This, not a conversion, is what the history uses.') +
    '<div class="calc" id="pf-calc"></div>' + linkBlock +
    '<fieldset><legend>From the bank, when you have it</legend>' +
    field('INR applied by PNB', '<input id="pf-applied" inputmode="decimal" value="' + esc(money(pay.inrApplied)) + '">') +
    '<div class="two">' + field('To interest', '<input id="pf-int" inputmode="decimal" value="' + esc(money(pay.interest)) + '">') +
    field('To principal', '<input id="pf-prin" inputmode="decimal" value="' + esc(money(pay.principal)) + '">') + '</div>' +
    '<span class="hint" style="font-size:12px;color:var(--muted)">Leave these blank until a statement shows them.</span>' +
    '<label class="toggle"><span>Confirmed by PNB</span><input type="checkbox" id="pf-conf"' + (pay.confirmed ? ' checked' : '') + '></label></fieldset>' +
    field('Note', '<input id="pf-note" maxlength="500" value="' + esc(pay.note) + '">') +
    '<div class="err" role="alert"></div><div class="btns">' + (isNew ? '' : '<button class="btn danger" type="button" data-x="del">Delete</button>') + '<button class="btn primary" type="button" data-x="save">Save payment</button></div>', { name: 'form-payment' });

  function calc() {
    const u = parseMoney(val(m, 'pf-usd')), f = parseMoney(val(m, 'pf-fee')), r = parseMoney(val(m, 'pf-inr'));
    const total = (isNum(u) ? u : 0) + (isNum(f) ? f : 0);
    let h = '<div><span>Total leaving your account</span><strong id="pf-total">' + usd(total) + '</strong></div>';
    if (isNum(u) && u > 0 && isNum(f) && f > 0) h += '<div><span>Fee</span><span>' + (f / u * 100).toFixed(1) + '% of the amount sent</span></div>';
    if (isNum(r) && r > 0 && total > 0) h += '<div><span>Effective rate</span><span id="pf-eff">' + inr(Math.round(r / total * 100)) + ' per $1</span></div>';
    $('#pf-calc', m.sheet).innerHTML = h;
  }
  m.sheet.addEventListener('input', calc);
  m.sheet.addEventListener('change', (e) => {
    if (e.target.name === 'pf-mode') $('#pf-txbox', m.sheet).classList.toggle('hidden', e.target.value !== 'link');
  });
  calc();
  m.sheet.addEventListener('click', (e) => {
    const b = e.target.closest('[data-x]'); if (!b) return;
    if (b.dataset.x === 'del') {
      const lt = pay.txnId ? db.tables.Transactions[pay.txnId] : null;
      confirmBox('Delete this payment?', 'It is removed from the loan history.', 'Delete', (alsoTx) => {
        closeModal(m);
        batch(() => { del('LoanPayments', pay.id); if (alsoTx && lt) del('Transactions', lt.id); });
        showToast(alsoTx && lt ? 'Payment and its expense deleted' : 'Payment deleted');
      }, {
        danger: true,
        extra: lt ? '<label class="toggle"><span>Also delete the ' + esc(usd(toCents(lt.amount))) + ' expense from your budget</span><input type="checkbox" id="also-tx"' + (pay.txnId.indexOf('lp-') === 0 ? ' checked' : '') + '></label>' : '',
        read: (sheet) => { const x = $('#also-tx', sheet); return !!(x && x.checked); }
      });
      return;
    }
    const date = val(m, 'pf-date');
    const u = parseMoney(val(m, 'pf-usd')), f = parseMoney(val(m, 'pf-fee'));
    const fx = parseNumber(val(m, 'pf-fx')), r = parseMoney(val(m, 'pf-inr'));
    const applied = parseMoney(val(m, 'pf-applied')), it = parseMoney(val(m, 'pf-int')), pr = parseMoney(val(m, 'pf-prin'));
    if (!isDate(date)) return setErr(m, 'Pick the payment date');
    if (!isNum(u) || u <= 0) return setErr(m, 'Enter the USD amount sent, like 200');
    if (Number.isNaN(f) || (f != null && f < 0)) return setErr(m, 'Fee must be an amount like 3, or blank');
    if ([fx, r, applied, it, pr].some((x) => Number.isNaN(x) || (x != null && x < 0))) return setErr(m, 'Check the numbers: only digits and a decimal point');
    const account = val(m, 'pf-acc');
    if (!account) return setErr(m, 'Add an account first');
    const total = u + (f || 0);
    const modeEl = $('input[name="pf-mode"]:checked', m.sheet);
    const mode = linked ? 'keep' : modeEl ? modeEl.value : 'create';
    let txnId = pay.txnId;
    if (mode === 'create') txnId = 'lp-' + pay.id;
    else if (mode === 'link') { txnId = val(m, 'pf-tx'); if (!txnId) return setErr(m, 'Choose the expense to link'); }
    const row = Object.assign({}, pay, {
      date, usd: u / 100, fee: (f || 0) / 100, provider: val(m, 'pf-provider'), fx: fx == null ? null : fx,
      inr: r == null ? null : r / 100, inrApplied: applied == null ? null : applied / 100,
      interest: it == null ? null : it / 100, principal: pr == null ? null : pr / 100,
      txnId, confirmed: $('#pf-conf', m.sheet).checked, note: val(m, 'pf-note')
    });
    closeModal(m);
    batch(() => {
      put('LoanPayments', row);
      const existing = db.tables.Transactions[txnId];
      if (mode === 'create' && !existing) {
        put('Transactions', { id: txnId, date, type: 'expense', amount: total / 100, category: L.category, account, toAccount: '', goal: '', note: 'Loan payment' + (row.provider ? ', ' + row.provider : ''), rid: '' });
      } else if (existing) {
        // One expense per payment, always equal to what left the account.
        const upd = Object.assign({}, existing, { amount: total / 100, type: 'expense' });
        if (txnId.indexOf('lp-') === 0) { upd.date = date; upd.account = account; }
        if (toCents(existing.amount) !== total || upd.date !== existing.date || upd.account !== existing.account || existing.type !== 'expense') put('Transactions', upd);
      }
      meta.lastAccount = account; saveMeta();
    });
    showToast(isNew ? 'Payment recorded, ' + usd(total) + ' in ' + L.category : 'Payment saved');
  });
}

function formStatement(L) {

    '<div class="err" role="alert"></div><div class="btns"><button class="btn primary" type="button" data-x="save">Save</button></div>', { name: 'form-statement' });

    showToast('Bank figures saved');

function formQuestion(q) {
  const D = derive();
  const L = D.loans.find((l) => l.name === q.loan) || currentLoan();
  const f = Q_FIELD[q.field];
  let inner = '';
  if (f && !q.resolved) {
    inner = f.kind === 'date' ? field(f.label, '<input id="q-val" type="date">') :
      '<div class="two">' + field(f.label, '<input id="q-val" inputmode="decimal">') + field('As of', '<input id="q-asof" type="date" value="' + today() + '">') + '</div>';
    inner += '<p class="note-line">The value fills the loan snapshot as confirmed.</p>';
  }
  const m = openModal('<h2>' + esc(q.question) + '</h2>' + inner +
    field('Answer from the bank', '<textarea id="q-ans" maxlength="500">' + esc(q.answer) + '</textarea>') +
    '<div class="err" role="alert"></div><div class="btns">' + (q.resolved ? '<button class="btn" type="button" data-x="reopen">Reopen</button><button class="btn primary" type="button" data-x="save">Save</button>' :
      '<button class="btn" type="button" data-x="save">Save note</button><button class="btn primary" type="button" data-x="resolve">Mark resolved</button>') + '</div>', { name: 'form-question' });
  m.sheet.addEventListener('click', (e) => {
    const b = e.target.closest('[data-x]'); if (!b) return;
    const answer = val(m, 'q-ans');
    if (b.dataset.x === 'reopen') { closeModal(m); put('LoanQuestions', Object.assign({}, q, { resolved: false, resolvedOn: '', answer })); return; }
    if (b.dataset.x === 'save') { closeModal(m); put('LoanQuestions', Object.assign({}, q, { answer })); return; }
    let value = null, asOf = today();
    if (f) {
      const raw = val(m, 'q-val');
      if (f.kind === 'date') { if (raw && !isDate(raw)) return setErr(m, 'Pick a date'); value = raw || null; }
      else {
        value = f.kind === 'rate' ? parseNumber(raw) : parseMoney(raw);
        if (Number.isNaN(value) || (value != null && value < 0)) return setErr(m, 'Enter a number');
        const a = val(m, 'q-asof'); if (isDate(a)) asOf = a;
      }
      if (value == null && !answer) return setErr(m, 'Enter the value, or write the answer');
    }
    closeModal(m);
    batch(() => {
      put('LoanQuestions', Object.assign({}, q, { resolved: true, resolvedOn: today(), answer }));
      if (f && value != null) {
        const upd = Object.assign({}, L);
        if (q.field === 'roi') addConfirmedRate(L, asOf, value, 'PNB', answer);
        else if (f.kind === 'inr') { upd[q.field] = value / 100; if (!isDate(upd.lastVerified) || asOf > upd.lastVerified) upd.lastVerified = asOf; }
        else if (q.field === 'statement') upd.lastVerified = value;
        else upd[q.field] = value;
        if (q.field !== 'roi') put('Loans', upd);
      }
    });
  });
}

/* ================================================================== */
/* Settings and connect                                                  */
/* ================================================================== */

function settingsHTML() {
  const D = derive();
  const n = pending();
  const err = meta.error ? (ERR_TEXT[meta.error] || 'Something went wrong (' + meta.error + '). It will try again shortly.') : '';
  const label = (t) => ({ Transactions: 'Entry', Categories: 'Category', Accounts: 'Account', Recurring: 'Recurring item', Goals: 'Goal', LoanDisbursements: 'Loan disbursement', LoanPayments: 'Loan payment', LoanRates: 'Loan rate' })[t] || t;
  const describe = (i) => {
    const r = i.row;
    const bits = [r.date, r.name || r.category, isNum(r.amount) ? usd(toCents(r.amount)) : r.amount, r.note].filter((x) => x !== '' && x != null).map(String);
    return label(i.t) + (bits.length ? ': ' + bits.join(', ') : '');
  };
  return '<div class="grab"></div><h2>Settings</h2><ul class="list">' +
    '<li class="row"><span class="main">Last synced</span><span id="s-last">' + esc(ago(meta.lastSync)) + '</span></li>' +
    '<li class="row"><span class="main">Changes waiting to sync</span><span id="s-pending" class="num">' + n + '</span></li></ul>' +
    (err ? '<p class="flag" id="s-error" role="alert">' + esc(err) + '</p>' : '') +
    '<div class="btns"><button class="btn primary" type="button" data-x="sync">Sync now</button>' + (meta.sheetUrl ? '<a class="btn" style="text-align:center;text-decoration:none;color:inherit;display:inline-flex;align-items:center;justify-content:center" href="' + esc(meta.sheetUrl) + '" target="_blank" rel="noopener">Open Google Sheet</a>' : '') + '</div>' +
    '<h2>Rows needing attention</h2>' + (D.issues.length ? '<p class="note-line">These rows in the Sheet are left out of all totals until fixed there.</p><ul class="list" id="s-issues">' +
      D.issues.map((i) => '<li class="row"><span class="main"><span class="t wrap" style="display:block;white-space:normal">' + esc(describe(i)) + '</span><span class="s wrap" style="display:block">' + esc(i.problem) + '</span></span></li>').join('') + '</ul>' :
      '<div class="empty" id="s-issues">None. Every row in the Sheet is readable.</div>') +
    '<h2>Good to know</h2><p class="note-line">Changes made in the Sheet reach this phone within about 30 seconds while the app is open, and whenever you open it. Instant updates would need a paid server.</p>' +
    '<p class="note-line">Budgets are one number per category and apply to every month, past months included.</p>' +
    '<p class="note-line">Deleting a row by hand in the Sheet works, but deleting in the app is cleaner.</p>' +
    '<div class="btns"><button class="btn" type="button" data-x="change">Change connection</button><button class="btn danger" type="button" data-x="reset">Reset this device</button></div>';
}
function openSettings() {
  if (stack.some((m) => m.name === 'settings')) return;
  const m = openModal(settingsHTML(), { name: 'settings', refresh: () => { m.sheet.innerHTML = settingsHTML(); } });
  m.sheet.addEventListener('click', (e) => {
    const b = e.target.closest('[data-x]'); if (!b) return;
    if (b.dataset.x === 'sync') { fails = 0; if (meta.error && STOP_ERRORS[meta.error]) meta.error = null; sync(); }
    if (b.dataset.x === 'change') {
      const n = pending();
      const doIt = () => { closeModal(m); disconnect(); };
      if (n) confirmBox('Change connection?', plural(n, 'change') + ' on this phone ' + (n === 1 ? 'has' : 'have') + ' not reached the Sheet yet and will be lost.', 'Change anyway', doIt, { danger: true });
      else doIt();
    }
    if (b.dataset.x === 'reset') {
      confirmBox('Reset this device?', 'This clears everything stored on this phone' + (pending() ? ', including ' + plural(pending(), 'change') + ' not yet synced' : '') + '. The Google Sheet is not touched.', 'Reset', () => {
        try { localStorage.removeItem(DB_KEY); localStorage.removeItem(OUT_KEY); localStorage.removeItem(META_KEY); } catch (err) { /* ignore */ }
        location.reload();
      }, { danger: true });
    }
  });
}
function disconnect() {
  db = emptyDb(); out = {}; meta = {};
  saveDb(); saveOut(); saveMeta();
  rev++;
  render();
}

function renderConnect() {
  $('#app').classList.add('hidden');
  if ($('#connect')) return;
  const c = document.createElement('div');
  c.id = 'connect';
  c.className = 'connect';
  c.innerHTML = '<section class="hero"><div class="hero-label">Budget tracker</div><div class="figure" style="font-size:40px">Connect</div><div class="hero-sub">Link this phone to your Google Sheet once. After that it works offline and syncs by itself.</div></section>' +
    '<label for="code" class="field" style="margin:0"><span>Connection code</span></label><textarea id="code" placeholder="BT1|https://script.google.com/macros/s/...|..." autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>' +
    '<div class="err" id="connect-err" role="alert"></div><div class="btns"><button class="btn primary" type="button" id="connect-btn">Connect</button></div>' +
    '<ol><li>Open your Google Sheet and go to the Connect tab.</li><li>Copy cell B7. The Google Sheets app on the phone works too.</li><li>Paste it above and tap Connect.</li></ol>';
  document.body.appendChild(c);
  $('#connect-btn').addEventListener('click', connect);
}

async function connect() {
  const btn = $('#connect-btn'), errEl = $('#connect-err');
  const raw = $('#code').value.replace(/\s+/g, '');
  const parts = raw.split('|');
  errEl.textContent = '';
  if (parts.length !== 3 || parts[0] !== 'BT1' || !/^https?:\/\/\S+$/.test(parts[1]) || !parts[2]) { errEl.textContent = ERR_TEXT.bad_code; return; }
  const conn = { url: parts[1], key: parts[2] };
  btn.disabled = true; btn.textContent = 'Connecting';
  try {
    const r = await api('GET', { action: 'ping' }, conn);
    if (r.app !== 'budget-tracker') throw apiError('wrong_app');
    db = emptyDb(); out = {}; meta = { url: conn.url, key: conn.key };
    saveDb(); saveOut(); saveMeta();
    await sync({ full: true });
    if (meta.error) throw apiError(meta.error);
    $('#connect').remove();
    ui.view = 'home';
    render();
    showToast('Connected to your Sheet');
  } catch (e) {
    if (meta.url === conn.url && meta.error) { meta = {}; saveMeta(); }
    errEl.textContent = ERR_TEXT[e.code] || ('Could not connect (' + (e.code || e.message) + ').');
  } finally {
    btn.disabled = false; btn.textContent = 'Connect';
  }
}

/* ================================================================== */
/* Events                                                                */
/* ================================================================== */

const actions = {
  go: (b) => { if (b.dataset.tab) ui.planTab = b.dataset.tab; if (b.dataset.view === 'plan' || b.dataset.view !== ui.view) go(b.dataset.view); else render(); },
  add: () => openEntry({ type: 'expense' }),
  settings: () => openSettings(),
  month: (b) => { const d = Number(b.dataset.d); ui.month = d === 0 ? thisMonth() : addMonths(ui.month, d); render(); },
  filter: (b) => { ui.filter = b.dataset.f; render(); },
  plantab: (b) => { ui.planTab = b.dataset.tab; render(); },
  'edit-txn': (b) => {
    const r = db.tables.Transactions[b.dataset.id]; if (!r) return;
    const p = derive().loanTxnIds[r.id];
    if (p) formPayment(p); else openEntry({ txn: r });
  },
  paid: (b) => { const rec = db.tables.Recurring[b.dataset.id]; if (rec) markPaid(rec, b.dataset.d); },
  skip: (b) => { const rec = db.tables.Recurring[b.dataset.id]; if (rec) markSkipped(rec, b.dataset.d); },
  'new-cat': () => formCategory(null),
  'edit-cat': (b) => formCategory(db.tables.Categories[b.dataset.id]),
  'new-rec': () => formRecurring(null),
  'edit-rec': (b) => formRecurring(db.tables.Recurring[b.dataset.id]),
  'new-goal': () => formGoal(null),
  'edit-goal': (b) => formGoal(db.tables.Goals[b.dataset.id]),
  'goal-add': (b) => openEntry({ goal: db.tables.Goals[b.dataset.id].name, dir: 'in' }),
  'goal-out': (b) => openEntry({ goal: db.tables.Goals[b.dataset.id].name, dir: 'out' }),
  'new-acc': () => formAccount(null),
  'edit-acc': (b) => formAccount(db.tables.Accounts[b.dataset.id]),
  transfer: () => openEntry({ type: 'transfer' }),
  'pick-loan': (b) => { ui.loanId = b.dataset.id; render(); },
  'loan-statement': () => formStatement(currentLoan()),
  'loan-details': () => formLoanDetails(currentLoan()),
  'loan-pay': () => formPayment(null),
  'edit-pay': (b) => { const p = db.tables.LoanPayments[b.dataset.id]; if (p) formPayment(p); },
  question: (b) => { const q = db.tables.LoanQuestions[b.dataset.id]; if (q) formQuestion(q); },
  'loan-planned': () => {
    const L = currentLoan(), cat = derive().catByName[L.category];
    formValue('Loan payment planned', 'USD a month', cat && isNum(cat.budget) && cat.budget ? centsInput(toCents(cat.budget)) : '', 'This sets your ' + esc(L.category) + ' budget, so Home and Budgets use the same number.', (v) => setPlannedPayment(L, v || 0), { clear: true });
  },
  'loan-buffer': () => {
    const L = currentLoan();
    formValue('Minimum cash buffer', 'USD', isNum(L.buffer) ? centsInput(toCents(L.buffer)) : '', 'Plans that leave less cash than this at month end are marked Below cash buffer.', (v) => put('Loans', Object.assign({}, L, { buffer: v == null ? null : v / 100 })), { clear: true, example: '2000' });
  },
  'loan-fx': () => {
    const L = currentLoan();
    formValue('Planning exchange rate', 'Rupees per $1', isNum(L.fx) ? String(L.fx) : '', 'Only for estimating future payments. Past payments use the rupees actually received.', (v) => put('Loans', Object.assign({}, L, { fx: v == null || v === 0 ? null : v })), { clear: true, number: true, example: '95.50' });
  },
  scenario: (b) => {
    const L = currentLoan(), amt = Number(b.dataset.usd);
    confirmBox('Plan ' + usdShort(amt) + ' a month?', 'This sets your ' + L.category + ' budget to ' + usdShort(amt) + '. You can change it any time.', 'Set plan', () => setPlannedPayment(L, amt));
  }
};

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b || !actions[b.dataset.act]) return;
  if (b.closest('.overlay')) return;
  actions[b.dataset.act](b, e);
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { ui.q = e.target.value; $('#list').innerHTML = activityList(); }
});
document.addEventListener('keydown', (e) => {
  const m = topModal();
  if (!m) return;
  if (e.key === 'Escape') { e.preventDefault(); closeModal(m); return; }
  if (m.onKey && m.onKey(e)) e.preventDefault();
});
window.addEventListener('online', () => { meta.error = null; fails = 0; updatePill(); sync(); });
window.addEventListener('offline', () => updatePill());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { sync(); requestRender(); } });
setInterval(() => { if (document.visibilityState === 'visible') sync(); }, 30000);
setInterval(() => { if (document.visibilityState === 'visible' && ui.view === 'home' && !stack.length) requestRender(); }, 60000);

/* ================================================================== */
/* Boot                                                                  */
/* ================================================================== */

load();
buildRosette();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* not supported */ }
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('./sw.js').catch(() => {});
render();
if (meta.url) sync();

// Small handle for the test suite and for debugging in DevTools.
window.BT = { sync, derive, monthStats, loanCalc, loanPlan, state: () => ({ db, out, meta }), today };
})();
</script>
