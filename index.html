<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ECF0EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1411" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Personal budget tracker that syncs with a Google Sheet.">
<title>Budget</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
:root {
  --paper: #ECF0EB; --surface: #F8FAF7; --ink: #18221D; --muted: #5B6961; --rule: #C8D2CB;
  --note: #1E4D3A; --note-line: #2B6750; --note-text: #EEF4EE;
  --pos: #1F7A4D; --warn: #A66A0E; --over: #A5342B; --over-panel: #6A2A24; --over-line: #84403A;
  --shade: rgba(24, 34, 29, .06); --scrim: rgba(14, 20, 17, .42);
  --font: 'Archivo', system-ui, Roboto, 'Segoe UI', sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0E1411; --surface: #151D19; --ink: #E4EBE6; --muted: #97A69D; --rule: #2B3631;
    --note: #1B4434; --note-line: #2F6B53; --note-text: #EEF4EE;
    --pos: #5BBF8A; --warn: #E2A548; --over: #E5766B; --over-panel: #5A231E; --over-line: #7A3A33;
    --shade: rgba(228, 235, 230, .06); --scrim: rgba(0, 0, 0, .6);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.4 var(--font);
  -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pos); outline-offset: 2px; }
.num, .amt, .figure, td.n { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { max-width: 560px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; position: relative; }
.top {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: var(--paper);
}
.top h1 { margin: 0; font-size: 22px; font-weight: 700; font-stretch: 112%; letter-spacing: -.01em; }
.pill {
  border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 5px 12px 5px 10px;
  font-size: 13px; display: inline-flex; align-items: center; gap: 7px; min-height: 32px;
}
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pos); }
.pill[data-state="syncing"] .dot { background: var(--muted); animation: pulse 1s infinite alternate; }
.pill[data-state="waiting"] .dot, .pill[data-state="offline"] .dot { background: var(--warn); }
.pill[data-state="error"] .dot { background: var(--over); }
@keyframes pulse { to { opacity: .25; } }

main { padding: 0 16px calc(104px + env(safe-area-inset-bottom)); }
.view-enter { animation: fadein .16s ease-out; }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } }

/* Bottom navigation with the coin */
.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 6; max-width: 560px; margin: 0 auto;
  display: grid; grid-template-columns: 1fr 1fr 84px 1fr 1fr; align-items: end;
  background: var(--surface); border-top: 1px solid var(--rule);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tab {
  border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 0; font-size: 12px; color: var(--muted); min-height: 48px; touch-action: manipulation;
}
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; }
.tab[aria-current="page"] { color: var(--ink); font-weight: 600; }
.coin {
  justify-self: center; width: 64px; height: 64px; border-radius: 50%; border: 0; margin-top: -26px;
  background: var(--note); color: var(--note-text); position: relative; touch-action: manipulation;
  box-shadow: 0 2px 0 var(--note-line), 0 6px 16px rgba(0,0,0,.18);
}
.coin::before { content: ''; position: absolute; inset: 5px; border-radius: 50%; border: 1px solid rgba(238,244,238,.5); }
.coin::after { content: ''; position: absolute; inset: 9px; border-radius: 50%; border: 1px dashed rgba(238,244,238,.22); }
.coin svg { width: 26px; height: 26px; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; position: relative; }

/* Month switcher */
.month { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 12px; }
.month button { border: 0; background: none; min-width: 44px; min-height: 44px; border-radius: 22px; display: grid; place-items: center; }
.month button svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
.month .label { font-weight: 600; font-size: 16px; padding: 8px 12px; }

/* Hero banknote panel */
.hero {
  --line: var(--note-line);
  position: relative; overflow: hidden; border-radius: 14px; background: var(--note); color: var(--note-text);
  padding: 20px 20px 16px; isolation: isolate;
}
.hero.neg { background: var(--over-panel); --line: var(--over-line); }
.hero::before { content: ''; position: absolute; inset: 6px; border: 1px solid var(--line); border-radius: 10px; pointer-events: none; z-index: -1; }
.hero::after {
  content: ''; position: absolute; width: 360px; height: 360px; right: -110px; top: -96px; z-index: -1;
  background: var(--line); -webkit-mask: var(--rosette) center / contain no-repeat; mask: var(--rosette) center / contain no-repeat;
}
.hero-label { font-size: 14px; opacity: .9; }
.figure { font-weight: 800; font-stretch: 125%; font-size: 50px; line-height: 1.05; letter-spacing: -.015em; margin: 4px 0 2px; white-space: nowrap; }
.figure .c { font-size: .44em; vertical-align: .95em; margin-left: 2px; font-weight: 700; letter-spacing: 0; }
.hero-sub { font-size: 14px; opacity: .92; min-height: 20px; }
.hero-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0 0; padding-top: 12px; border-top: 1px solid var(--line); }
.hero-stats div { min-width: 0; }
.hero-stats dt { font-size: 12px; opacity: .82; }
.hero-stats dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 15px; }
.nudge { margin-top: 10px; font-size: 13px; }
.nudge button { background: none; border: 0; color: inherit; text-decoration: underline; padding: 0; }

/* Ruled lists */
h2 { font-size: 15px; font-weight: 700; margin: 26px 0 4px; font-stretch: 105%; }
h3 { font-size: 14px; font-weight: 600; margin: 18px 0 2px; color: var(--muted); }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.section-head .link { margin-top: 26px; }
.list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.row {
  display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--rule);
  min-height: 52px; width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left;
}
button.row { cursor: pointer; }
button.row:active { background: var(--shade); }
.row .ic { width: 32px; height: 32px; flex: none; display: grid; place-items: center; font-size: 19px; border-radius: 50%; background: var(--surface); border: 1px solid var(--rule); }
.row .main { flex: 1; min-width: 0; }
.row .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .s { font-size: 13px; color: var(--muted); }
.row .wrap { white-space: normal; }
.row .end { text-align: right; flex: none; max-width: 52%; }
.amt { font-weight: 600; white-space: nowrap; }
.amt.in { color: var(--pos); }
.amt.out { color: var(--ink); }
.amt.flat { color: var(--muted); }
.row .acts { display: flex; gap: 6px; flex: none; }
.empty { color: var(--muted); padding: 14px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
.link { background: none; border: 0; color: var(--pos); font-weight: 600; padding: 6px 0; min-height: 36px; font-size: 14px; }
.daytot { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.dayhead { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 0 4px; font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--rule); }

.flows { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--rule); margin-top: 6px; }
.flows div { padding: 12px 0; }
.flows div + div { border-left: 1px solid var(--rule); padding-left: 12px; }
.flows dt { font-size: 12px; color: var(--muted); }
.flows dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }

.bar { height: 6px; border-radius: 3px; background: var(--rule); margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--pos); border-radius: 3px; }
.bar.warn i { background: var(--warn); }
.bar.over i { background: var(--over); }
.left-warn, .row .s.left-warn { color: var(--warn); }
.left-over, .row .s.left-over { color: var(--over); }

/* Buttons */
.btn {
  border: 1px solid var(--rule); background: var(--surface); border-radius: 10px; padding: 10px 14px; min-height: 44px;
  font-weight: 600; touch-action: manipulation;
}
.btn.primary { background: var(--note); color: var(--note-text); border-color: var(--note); }
.btn.danger { color: var(--over); }
.btn.small { min-height: 34px; padding: 5px 11px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: .5; cursor: default; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0; }
.btns .btn { flex: 1; }

/* Segmented controls and chips */
.seg { display: flex; border: 1px solid var(--rule); border-radius: 10px; padding: 3px; gap: 3px; background: var(--surface); }
.seg button { flex: 1; border: 0; background: none; border-radius: 7px; padding: 8px 6px; font-size: 14px; min-height: 38px; touch-action: manipulation; }
.seg button[aria-pressed="true"] { background: var(--note); color: var(--note-text); font-weight: 600; }
.filters { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
.filters button { border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-size: 14px; white-space: nowrap; min-height: 36px; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.search { width: 100%; border: 1px solid var(--rule); background: var(--surface); border-radius: 10px; padding: 10px 12px; min-height: 44px; }

/* Status tags for loan figures */
.tag { display: inline-block; font-size: 12px; line-height: 1.5; padding: 0 8px; border-radius: 999px; border: 1px solid; white-space: nowrap; font-weight: 500; }
.tag.confirmed { color: var(--pos); border-color: var(--pos); }
.tag.estimated { color: var(--warn); border-style: dashed; }
.tag.unknown { color: var(--muted); border-style: dotted; }
.tag.warn { color: var(--warn); }
.tag.over { color: var(--over); }
.est { font-style: italic; color: var(--muted); text-decoration: underline dotted; text-underline-offset: 3px; }
.unk { color: var(--muted); font-weight: 400; }
.snap .end { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.note-line { font-size: 13px; color: var(--muted); margin: 8px 0; }
.flag { font-size: 13px; color: var(--warn); }
.check { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--muted); flex: none; display: grid; place-items: center; }
.check.on { background: var(--pos); border-color: var(--pos); }
.check.on::after { content: ''; width: 9px; height: 5px; border-left: 2px solid var(--surface); border-bottom: 2px solid var(--surface); transform: rotate(-45deg) translate(1px, -1px); }

/* Accounts */
.networth { padding: 6px 0 14px; border-bottom: 1px solid var(--rule); }
.networth .figure { font-size: 38px; color: var(--ink); }

/* Modals and sheets */
.overlay {
  position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center;
  animation: fadein2 .14s ease-out;
}
@keyframes fadein2 { from { opacity: 0; } }
.sheet {
  width: 100%; max-width: 560px; max-height: 94vh; max-height: 94dvh; overflow-y: auto; background: var(--surface);
  border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); animation: up .18s ease-out;
}
.sheet.center { border-radius: 16px; margin: 16px; max-width: 420px; align-self: center; }
@keyframes up { from { transform: translateY(24px); opacity: .6; } }
.sheet h2 { margin: 2px 0 12px; font-size: 18px; }
.sheet .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--rule); margin: -6px auto 10px; }
.field { display: block; margin: 12px 0; }
.field > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.field input, .field select, .field textarea {
  width: 100%; border: 1px solid var(--rule); background: var(--paper); border-radius: 10px; padding: 10px 12px; min-height: 44px;
}
.field textarea { min-height: 90px; resize: vertical; }
.field .hint { font-size: 12px; color: var(--muted); margin-top: 4px; display: block; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.two .field { margin: 6px 0; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; }
.toggle input { width: 22px; height: 22px; accent-color: var(--pos); }
.err { color: var(--over); font-size: 14px; min-height: 20px; margin: 6px 0; }
.calc { font-size: 13px; color: var(--muted); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 8px 0; margin: 10px 0; }
.calc div { display: flex; justify-content: space-between; gap: 10px; }
fieldset { border: 0; padding: 0; margin: 14px 0; }
legend { font-weight: 600; font-size: 14px; padding: 0; margin-bottom: 4px; }
.radio { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; }
.radio input { margin-top: 3px; accent-color: var(--pos); width: 18px; height: 18px; }

/* Entry sheet */
.entry { padding-top: 12px; }
.amount { text-align: right; padding: 12px 4px 6px; min-height: 92px; }
.amount .expr { font-size: 15px; color: var(--muted); min-height: 20px; font-variant-numeric: tabular-nums; }
.amount .big { font-size: 46px; font-weight: 800; font-stretch: 118%; font-variant-numeric: tabular-nums; line-height: 1.1; }
.amount.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.pills { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 10px; }
.epill {
  position: relative; border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; padding: 7px 13px;
  font-size: 14px; min-height: 38px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 6px;
}
.epill .k { color: var(--muted); }
.epill input[type="date"] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; padding: 0; cursor: pointer; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); grid-auto-rows: 54px; gap: 6px; max-height: 204px; overflow-y: auto; margin-bottom: 4px; overscroll-behavior: contain; }
.chip {
  border: 1px solid var(--rule); background: var(--paper); border-radius: 10px; padding: 5px 6px; height: 54px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 13px; touch-action: manipulation;
  overflow: hidden;
}
.chip .e { font-size: 18px; line-height: 1.1; }
.chip span:last-child { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip[aria-pressed="true"] { border-color: var(--note); background: var(--note); color: var(--note-text); }
.keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.key {
  border: 0; background: var(--paper); border-radius: 10px; min-height: 54px; font-size: 22px; font-weight: 600;
  touch-action: manipulation; font-variant-numeric: tabular-nums; user-select: none;
}
.key:active { background: var(--rule); }
.key.op { color: var(--muted); font-size: 20px; }
.entry .btns { margin: 6px 0 10px; }
.entry .err { min-height: 18px; margin: 2px 0 4px; font-size: 13px; }
.goalbox { padding: 6px 0 10px; font-weight: 600; }

/* Toast */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom)); z-index: 40;
  background: var(--ink); color: var(--paper); border-radius: 12px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 12px;
  max-width: calc(100% - 32px); width: max-content; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.2);
}
.toast button { background: none; border: 0; color: var(--paper); font-weight: 700; text-decoration: underline; padding: 6px 8px; min-height: 36px; }

/* Connect screen */
.connect { padding: calc(28px + env(safe-area-inset-top)) 16px 40px; max-width: 560px; margin: 0 auto; }
.connect .hero { margin-bottom: 20px; }
.connect textarea { width: 100%; min-height: 110px; border: 1px solid var(--rule); background: var(--surface); border-radius: 10px; padding: 12px; font-size: 14px; }
.connect ol { padding-left: 20px; color: var(--muted); font-size: 14px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media (min-width: 600px) {
  .tabs { border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); }
}
</style>
</head>
<body>
<div id="app">
  <header class="top" id="top">
    <h1 id="title">Home</h1>
    <button class="pill" id="pill" type="button" data-act="settings" data-state="ok" aria-label="Sync status, open settings"><span class="dot"></span><span id="pilltext">Synced</span></button>
  </header>
  <main id="main"></main>
  <nav class="tabs" id="tabs" aria-label="Main">
    <button class="tab" data-act="go" data-view="home" type="button"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/></svg>Home</button>
    <button class="tab" data-act="go" data-view="activity" type="button"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg>Activity</button>
    <button class="coin" data-act="add" type="button" aria-label="Add an entry"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab" data-act="go" data-view="plan" type="button"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Plan</button>
    <button class="tab" data-act="go" data-view="accounts" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg>Accounts</button>
  </nav>
</div>
<script>
'use strict';
(() => {
/* ================================================================== */
/* Constants and formatting                                            */
/* ================================================================== */

const DB_KEY = 'bt.db.v1', OUT_KEY = 'bt.out.v1', META_KEY = 'bt.meta.v1';
const TABLES = ['Transactions', 'Categories', 'Accounts', 'Recurring', 'Goals',
  'Loans', 'LoanDisbursements', 'LoanPayments', 'LoanRates', 'LoanQuestions'];
const LOAN_TABLES = ['LoanDisbursements', 'LoanPayments', 'LoanRates', 'LoanQuestions'];
const TYPES = ['expense', 'income', 'transfer', 'save'];
const KINDS = ['bank', 'credit', 'cash', 'wallet', 'other'];
const FREQS = ['weekly', 'biweekly', 'monthly', 'yearly'];
const KIND_LABEL = { bank: 'Bank', credit: 'Credit card', cash: 'Cash', wallet: 'Digital wallet', other: 'Other' };
const KIND_ICON = { bank: '🏦', credit: '💳', cash: '💵', wallet: '📱', other: '📁' };
const FREQ_LABEL = { weekly: 'Weekly', biweekly: 'Every two weeks', monthly: 'Monthly', yearly: 'Yearly' };
const BACKOFF = [3, 10, 30, 60, 120];
const STOP_ERRORS = { bad_key: 1, not_setup: 1 };
const ERR_TEXT = {
  bad_key: 'The access key no longer matches the Sheet. Copy the connection code again from the Connect tab (cell B7), then use Change connection.',
  not_setup: 'The script has not been set up yet. In Apps Script, run setup, then connect again.',
  bad_response: 'The script answered with something that is not data. In Apps Script, open Deploy > Manage deployments and check that Who has access is set to Anyone.',
  network: 'Could not reach Google. It will try again shortly.',
  offline: 'You are offline. Changes are saved on this phone and will sync when you are back online.',
  timeout: 'Google took too long to answer. It will try again shortly.',
  server_error: 'The script hit an error. It will try again shortly.',
  bad_code: 'That does not look like a connection code. Copy all of cell B7 on the Connect tab. It starts with BT1|',
  wrong_app: 'That address answered, but it is not this budget tracker script.',
  storage: 'This phone refused to save data. Free up some space, then try again.'
};

const MINUS = '−';
const USD = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
const USD0 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 0, maximumFractionDigits: 0 });
const INR0 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'INR', minimumFractionDigits: 0, maximumFractionDigits: 0 });

/* Local store: db, outbox, meta                                        */
/* ================================================================== */

/* ================================================================== */
/* Sync engine                                                          */
/* ================================================================== */

async function api(method, params, conn) {

/* ================================================================== */
/* Derived data. Rows that fail validation are left out of all maths.   */
/* ================================================================== */

let cache = { rev: -1 };
const rowsOf = (t) => Object.values(db.tables[t] || {});

function derive() {
  if (cache.rev === rev) return cache;
  const issues = [];
  const flag = (t, row, problem) => issues.push({ t, row, problem });

  const txns = [];
  for (const r of rowsOf('Transactions')) {
    if (!isDate(r.date)) flag('Transactions', r, 'Date is missing or not a date');
    else if (TYPES.indexOf(r.type) < 0) flag('Transactions', r, 'Type "' + r.type + '" is not expense, income, transfer or save');
    else if (!isNum(r.amount)) flag('Transactions', r, 'Amount is not a number');
    else txns.push(r);
  }
  txns.sort(byDateDesc);

  const cats = [];
  for (const r of rowsOf('Categories')) {
    if (!r.name) flag('Categories', r, 'Name is empty');
    else if (r.kind !== 'expense' && r.kind !== 'income') flag('Categories', r, 'Kind must be expense or income');
    else { if (r.budget !== 0 && !isNum(r.budget)) flag('Categories', r, 'Monthly budget is not a number, so it counts as 0'); cats.push(r); }
  }
  cats.sort(byOrder);
  const accounts = [];
  for (const r of rowsOf('Accounts')) {
    if (!r.name) flag('Accounts', r, 'Name is empty');
    else { if (KINDS.indexOf(r.kind) < 0) flag('Accounts', r, 'Kind "' + r.kind + '" is not bank, credit, cash, wallet or other'); if (!isNum(r.opening)) flag('Accounts', r, 'Opening balance is not a number, so it counts as 0'); accounts.push(r); }
  }
  accounts.sort(byOrder);
  const recurring = [];
  for (const r of rowsOf('Recurring')) {
    if (!r.name) flag('Recurring', r, 'Name is empty');
    else if (r.type !== 'expense' && r.type !== 'income') flag('Recurring', r, 'Type must be expense or income');
    else if (!isNum(r.amount)) flag('Recurring', r, 'Amount is not a number');
    else if (FREQS.indexOf(r.freq) < 0) flag('Recurring', r, 'Frequency must be weekly, biweekly, monthly or yearly');
    else if (!isDate(r.anchor)) flag('Recurring', r, 'Starts on is missing or not a date');

    if (!r.name) flag('Goals', r, 'Name is empty');

  }

  const loans = rowsOf('Loans').filter((r) => r.name).sort((a, b) => String(a.name).localeCompare(String(b.name)));

  for (const r of rowsOf('LoanPayments')) { if (!isDate(r.date) || !isNum(r.usd)) flag('LoanPayments', r, 'Needs a date and a USD amount'); else pays.push(r); }
  for (const r of rowsOf('LoanRates')) {

  questions.sort((a, b) => (a.order || 0) - (b.order || 0));

  const catByName = {}; cats.forEach((c) => { catByName[c.name] = c; });
  const goalByName = {}; goals.forEach((g) => { goalByName[g.name] = g; });

    const c = toCents(r.amount);
    if (r.type === 'income') bal[r.account] = (bal[r.account] || 0) + c;
    else if (r.type === 'expense' || r.type === 'save') bal[r.account] = (bal[r.account] || 0) - c;
    else if (r.type === 'transfer') { bal[r.account] = (bal[r.account] || 0) - c; bal[r.toAccount] = (bal[r.toAccount] || 0) + c; }
    if (r.type === 'save' && r.goal) goalSaved[r.goal] = (goalSaved[r.goal] || 0) + c;

/* ================================================================== */
/* Recurring bills and income                                           */
/* ================================================================== */

/** Occurrence dates in [from, to], always computed from the anchor. */
function occurrences(rec, from, to) {
  const res = [];

  if (!isDate(a) || from > to) return res;
  const start = from < a ? a : from;
  if (rec.freq === 'weekly' || rec.freq === 'biweekly') {
    const step = rec.freq === 'weekly' ? 7 : 14;
    for (let k = Math.max(0, Math.ceil(daysBetween(a, start) / step)); ; k++) {
      const d = addDays(a, k * step);
      if (d > to) break;
      res.push(d);
    }
  } else {
    const stepM = rec.freq === 'yearly' ? 12 : 1;
    const [ay, am, ad] = a.split('-').map(Number);
    const sk = Math.max(0, Math.floor(monthsBetween(a.slice(0, 7), start.slice(0, 7)) / stepM));
    for (let k = sk; k < sk + 2000; k++) {
      const i = ay * 12 + (am - 1) + k * stepM;
      const y = Math.floor(i / 12), m = i % 12 + 1;
      const d = y + '-' + pad(m) + '-' + pad(Math.min(ad, dim(y, m)));
      if (d > to) break;
      if (d >= start) res.push(d);
    }
  }

}

/** Logs every undone auto occurrence up to today. Returns how many writes it queued. */
function runAutoLog() {
  if (!meta.version) return 0;
  const D = derive();
  const t = today();
  let n = 0;
  batch(() => {
    for (const rec of D.recurring) {
      if (!rec.auto) continue;
      const occ = occurrences(rec, lowerBound(rec), t);
      for (const d of occ) {
        if (isDone(rec, d)) continue;
        put('Transactions', {
          id: occId(rec, d), date: d, type: rec.type, amount: rec.amount, category: rec.category,
          account: rec.account, toAccount: '', goal: '', note: rec.name, rid: rec.id
        });
        n++;
      }
      if (occ.length) {
        const last = occ[occ.length - 1];
        if (!isDate(rec.loggedThrough) || last > rec.loggedThrough) { put('Recurring', Object.assign({}, rec, { loggedThrough: last })); n++; }
      }
    }
  });

  put('Transactions', {
    id: occId(rec, d), date: d <= t ? d : t, type: rec.type, amount: rec.amount, category: rec.category,
    account: rec.account, toAccount: '', goal: '', note: rec.name, rid: rec.id
  });

}

    id: occId(rec, d), date: d, type: rec.type, amount: rec.amount, category: rec.category, account: rec.account, toAccount: '', goal: '', note: rec.name, rid: rec.id
  }) });

/* Month numbers                                                         */
/* ================================================================== */

  for (const r of D.txns) {
    if (r.date.slice(0, 7) !== mk) continue;
    s.txns.push(r);
    const c = toCents(r.amount);
    if (r.type === 'expense') { s.spent += c; s.byCat[r.category] = (s.byCat[r.category] || 0) + c; }
    else if (r.type === 'income') s.income += c;
    else if (r.type === 'save') s.saved += c;
  }
  for (const c of D.cats) if (c.kind === 'expense' && isNum(c.budget) && c.budget > 0) s.budget += toCents(c.budget);
  if (mk >= cur) {
    for (const rec of D.recurring) {
      const list = mk === cur ? undone(rec, end) : occurrences(rec, mk + '-01', end).filter((d) => !isDone(rec, d) && d >= lowerBound(rec));
      const amt = toCents(rec.amount) * list.length;
      if (rec.type === 'expense') { s.bills += amt; s.billsByCat[rec.category] = (s.billsByCat[rec.category] || 0) + amt; }
      else s.expIncome += amt;
    }
  }
  s.state = mk === cur ? 'current' : mk < cur ? 'past' : 'future';
  s.daysLeft = s.state === 'current' ? dim(+mk.slice(0, 4), +mk.slice(5, 7)) - Number(t.slice(8, 10)) + 1 : 0;
  if (s.state === 'current') {
    if (s.budget > 0) { s.label = 'Free to spend'; s.value = s.budget - s.spent - s.bills; }
    else { s.label = 'Left this month'; s.value = s.income + s.expIncome - s.spent - s.saved - s.bills; s.noBudgets = true; }
  } else if (s.state === 'past') {
    if (s.budget > 0) { s.label = 'Left in budget'; s.value = s.budget - s.spent; }
    else { s.label = 'Left'; s.value = s.income - s.spent - s.saved; s.noBudgets = true; }
  } else {
    s.label = s.budget > 0 ? 'Budget after bills' : 'Bills due'; s.value = s.budget > 0 ? s.budget - s.bills : -s.bills;
  }
  return s;
}

/* ================================================================== */
/* Education loan maths. INR in integer paise, USD in cents.            */
/* ================================================================== */

const paise = (v) => Math.round((Number(v) || 0) * 100);
/** Estimates are shown to the whole rupee; recorded amounts keep their paise. */
const rupee = (p) => Math.round(p / 100) * 100;
/** Latest rate effective on day d; on the same date confirmed beats estimated. */
function rateAt(rates, d) {
  let best = null;
  for (const r of rates) { if (r.date <= d) best = r; else break; }
  return best;
}

function loanCalc(L) {
  const D = derive();
  const t = today();
  const disb = D.disb.filter((x) => x.loan === L.name);
  const pays = D.pays.filter((x) => x.loan === L.name);
  const rates = D.rates.filter((x) => x.loan === L.name);
  const c = { L, disb, pays, rates };
  c.disbursed = disb.reduce((s, x) => s + paise(x.amount), 0);
  c.principalPaid = pays.reduce((s, x) => s + (isNum(x.principal) ? paise(x.principal) : 0), 0);
  c.interestPaid = pays.reduce((s, x) => s + (isNum(x.interest) ? paise(x.interest) : 0), 0);
  c.inrPaid = pays.reduce((s, x) => s + (isNum(x.inrApplied) ? paise(x.inrApplied) : isNum(x.inr) ? paise(x.inr) : 0), 0);
  c.firstDisb = disb.length ? disb[0].date : '';
  c.rate = rateAt(rates, t);

  // Principal on day d: disbursed so far minus principal the bank confirmed.
  const principalOn = (d) => {
    let p = 0;
    for (const x of disb) { if (x.date <= d) p += paise(x.amount); else break; }
    for (const x of pays) if (x.date <= d && isNum(x.principal)) p -= paise(x.principal);
    return p;
  };
  // Simple interest, actual/365, only over days a rate covers.
  c.interestBetween = (from, to) => {
    let sum = 0, covered = 0, days = 0;
    for (let d = from; d < to; d = addDays(d, 1)) {
      days++;
      const r = rateAt(rates, d);
      if (!r) continue;
      covered++;
      sum += principalOn(d) * r.rate / 100 / 365;
      if (days > 20000) break;
    }
    return { value: rupee(sum), covered, days };
  };

  c.principal = isNum(L.principal) ? { v: paise(L.principal), status: 'confirmed' } : { v: c.disbursed - c.principalPaid, status: 'estimated' };
  c.monthly = c.rate ? rupee(c.principal.v * c.rate.rate / 100 / 12) : null;

  if (isNum(L.accrued)) {
    c.accrued = { v: paise(L.accrued), status: 'confirmed', asOf: L.lastVerified };
    if (isDate(L.lastVerified) && L.lastVerified < t) c.accrued.since = c.interestBetween(L.lastVerified, t).value;
  } else if (rates.length && c.firstDisb && rates[0].date <= c.firstDisb) {
    c.accrued = { v: Math.max(0, c.interestBetween(c.firstDisb, t).value - c.interestPaid), status: 'estimated' };
  } else {
    c.accrued = { v: null, status: 'unknown', coverage: rates.length ? rates[0].date : '' };
    if (rates.length) {
      const from = c.firstDisb && c.firstDisb > rates[0].date ? c.firstDisb : rates[0].date;
      if (from < t) c.accrued.partial = c.interestBetween(from, t).value;
    }
  }
  if (isNum(L.outstanding)) c.total = { v: paise(L.outstanding), status: 'confirmed' };
  else if (c.accrued.v != null) c.total = { v: c.principal.v + c.accrued.v, status: 'estimated' };
  else c.total = { v: null, status: 'unknown', atLeast: c.principal.v };

  const lastWithFee = pays.find((p) => isNum(p.fee));
  c.lastFee = lastWithFee ? toCents(lastWithFee.fee) : null;
  c.fx = isNum(L.fx) && L.fx > 0 ? L.fx : null;
  return c;
}

/** Linked budget expense for a payment, and whether it matches. */
function paymentLink(p) {
  const tx = p.txnId ? db.tables.Transactions[p.txnId] : null;
  const total = toCents(p.usd) + (isNum(p.fee) ? toCents(p.fee) : 0);
  if (!p.txnId || !tx) return { tx: null, total, problem: 'No budget entry is linked, so this payment is not in your spending.' };
  if (tx.type !== 'expense') return { tx, total, problem: 'The linked entry is not an expense.' };
  if (toCents(tx.amount) !== total) return { tx, total, problem: 'Budget entry is ' + usd(toCents(tx.amount)) + ', payment totals ' + usd(total) + '.' };
  return { tx, total, problem: '' };
}

/** This month's plan from the tracker's own data. All USD cents. */
function loanPlan(L, c) {
  const D = derive();
  const mk = thisMonth(), end = monthEnd(mk);
  const loanCats = {}; D.loans.forEach((l) => { if (l.category) loanCats[l.category] = 1; });
  const p = { received: 0, expected: 0, spent: 0, saved: 0, planned: 0, unspent: 0, billsOutside: 0, loanPaid: 0 };
  const spentBy = {};
  for (const r of D.txns) {
    if (r.date.slice(0, 7) !== mk) continue;
    const a = toCents(r.amount);
    if (r.type === 'income') p.received += a;
    else if (r.type === 'save') p.saved += a;
    else if (r.type === 'expense') {
      if (r.category === L.category) p.loanPaid += a;
      else if (!loanCats[r.category]) spentBy[r.category] = (spentBy[r.category] || 0) + a;
    }
  }
  const billsBy = {};
  for (const rec of D.recurring) {
    const amt = toCents(rec.amount) * undone(rec, end).length;
    if (!amt) continue;
    if (rec.type === 'income') p.expected += amt;
    else if (!loanCats[rec.category]) billsBy[rec.category] = (billsBy[rec.category] || 0) + amt;
  }
  const names = {};
  D.cats.forEach((cat) => { if (cat.kind === 'expense' && !loanCats[cat.name]) names[cat.name] = 1; });
  Object.keys(spentBy).forEach((n) => { names[n] = 1; });
  Object.keys(billsBy).forEach((n) => { names[n] = 1; });
  for (const n in names) {
    const cat = D.catByName[n];
    const budget = cat && isNum(cat.budget) && cat.budget > 0 ? toCents(cat.budget) : 0;
    const spent = spentBy[n] || 0, bills = billsBy[n] || 0;
    const unspent = Math.max(0, budget - spent);
    p.planned += Math.max(budget, spent);
    p.unspent += unspent;
    p.billsOutside += Math.max(0, bills - unspent);  // a bill inside its budget is counted once
  }
  const loanCat = D.catByName[L.category];
  p.loanPlanned = loanCat && isNum(loanCat.budget) ? toCents(loanCat.budget) : 0;
  p.loanLine = Math.max(p.loanPlanned, p.loanPaid);
  p.loanRemaining = Math.max(0, p.loanPlanned - p.loanPaid);
  p.income = p.received + p.expected;
  p.leftBase = p.income - p.planned - p.billsOutside - p.saved;   // before any loan payment
  p.left = p.leftBase - p.loanLine;

  p.cash = 0;
  for (const a of D.accounts) {
    if (a.kind === 'bank' || a.kind === 'cash' || a.kind === 'wallet' || a.kind === 'credit') p.cash += D.bal[a.name] || 0;
  }
  // Cash at month end before this month's loan payments, then after the plan.
  p.cashBase = p.cash + p.loanPaid + p.expected - p.unspent - p.billsOutside;
  p.cashEnd = p.cashBase - p.loanLine;
  p.buffer = isNum(L.buffer) ? toCents(L.buffer) : null;
  p.above = p.buffer == null ? null : p.cashEnd - p.buffer;

  const fee = c.lastFee || 0;
  const amounts = [10000, 15000, 20000];
  const sc = amounts.map((a) => ({ usd: a, label: '' }));
  if (c.fx && c.monthly) {
    const cover = Math.ceil(c.monthly / c.fx / 100) * 100;
    sc.push({ usd: cover, label: 'Cover current interest' });
  }
  if (p.loanPlanned > 0 && !sc.some((s) => s.usd === p.loanPlanned)) sc.push({ usd: p.loanPlanned, label: 'Your current plan' });
  else sc.forEach((s) => { if (s.usd === p.loanPlanned) s.current = true; });
  sc.sort((a, b) => a.usd - b.usd);
  p.scenarios = sc.map((s) => {
    const total = s.usd + fee;
    const r = Object.assign({}, s, { total, left: p.leftBase - total, cashEnd: p.cashBase - total });
    if (c.fx) r.inr = rupee(s.usd * c.fx);
    if (r.inr != null && c.monthly) { r.cover = r.inr / c.monthly; r.growth = c.monthly - r.inr; }
    r.below = p.buffer != null && r.cashEnd < p.buffer;
    return r;
  });
  return p;
}

/* ================================================================== */
/* Rename cascades                                                       */
/* ================================================================== */

function cascade(kind, from, to) {
  if (!from || from === to) return;
  batch(() => {
    for (const r of rowsOf('Transactions')) {
      const n = Object.assign({}, r); let ch = false;
      if (kind === 'category' && r.category === from) { n.category = to; ch = true; }
      if (kind === 'account' && r.account === from) { n.account = to; ch = true; }
      if (kind === 'account' && r.toAccount === from) { n.toAccount = to; ch = true; }
      if (kind === 'goal' && r.goal === from) { n.goal = to; ch = true; }
      if (ch) put('Transactions', n);
    }
    for (const r of rowsOf('Recurring')) {
      const n = Object.assign({}, r); let ch = false;
      if (kind === 'category' && r.category === from) { n.category = to; ch = true; }
      if (kind === 'account' && r.account === from) { n.account = to; ch = true; }
      if (ch) put('Recurring', n);
    }
    if (kind === 'category') for (const r of rowsOf('Loans')) if (r.category === from) put('Loans', Object.assign({}, r, { category: to }));
    if (kind === 'loan') for (const t of LOAN_TABLES) for (const r of rowsOf(t)) if (r.loan === from) put(t, Object.assign({}, r, { loan: to }));
    if (kind === 'account' && meta.lastAccount === from) { meta.lastAccount = to; saveMeta(); }
  });
}

/* ================================================================== */
/* Rosette: guilloche lines for the hero, drawn once as a mask          */
/* ================================================================== */

function buildRosette() {
  const bands = [
    { R: 150, a: 15, n: 12, b: 4, m: 36, count: 16 },
    { R: 108, a: 11, n: 9, b: 3, m: 27, count: 14 },
    { R: 64, a: 8, n: 7, b: 2, m: 21, count: 12 },
    { R: 26, a: 5, n: 5, b: 0, m: 0, count: 8 }
  ];
  let d = '';
  for (const g of bands) {
    for (let j = 0; j < g.count; j++) {
      const ph = j * 2 * Math.PI / g.count;
      const steps = 240;
      for (let i = 0; i <= steps; i++) {
        const t = i / steps * 2 * Math.PI;
        const r = g.R + g.a * Math.sin(g.n * t + ph) + g.b * Math.sin(g.m * t - ph);
        d += (i ? 'L' : 'M') + (200 + r * Math.cos(t)).toFixed(1) + ' ' + (200 + r * Math.sin(t)).toFixed(1);
      }
    }
  }
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><path d="' + d +
    '" fill="none" stroke="#000" stroke-width="0.55"/><circle cx="200" cy="200" r="182" fill="none" stroke="#000" stroke-width="0.8"/>' +
    '<circle cx="200" cy="200" r="187" fill="none" stroke="#000" stroke-width="0.4"/></svg>';
  document.documentElement.style.setProperty('--rosette', 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")');
}

/* ================================================================== */
/* Modals, Android back, toast                                          */
/* ================================================================== */

const stack = [];
let backPending = 0, deferredGuards = 0;

/**
 * Opens a modal. Each modal pushes one history entry so Android back closes
 * it. If a UI close is still waiting for its popstate, the push waits too.
 */
function openModal(html, opts) {
  opts = opts || {};
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = '<div class="sheet ' + (opts.cls || '') + '" role="dialog" aria-modal="true">' + html + '</div>';
  const m = { el: ov, sheet: ov.firstChild, onKey: opts.onKey, onClose: opts.onClose, refresh: opts.refresh, name: opts.name || '' };
  ov.addEventListener('click', (e) => { if (e.target === ov) closeModal(m); });
  document.body.appendChild(ov);
  stack.push(m);
  if (backPending > 0) deferredGuards++;
  else history.pushState({ btModal: stack.length }, '');
  const f = m.sheet.querySelector('[autofocus]');
  if (f) setTimeout(() => f.focus(), 30);
  return m;
}
function closeModal(m, viaPop) {
  const i = stack.indexOf(m);
  if (i < 0) return;
  stack.splice(i, 1);
  m.el.remove();
  if (m.onClose) m.onClose();
  if (!viaPop) { backPending++; history.back(); }
}
const topModal = () => stack[stack.length - 1];
window.addEventListener('popstate', () => {
  if (backPending > 0) {
    backPending--;
    if (backPending === 0) for (; deferredGuards > 0; deferredGuards--) history.pushState({ btModal: 1 }, '');
    return;
  }
  const m = topModal();
  if (m) closeModal(m, true);
});

let toastTimer = null;
function showToast(msg, opts) {
  opts = opts || {};
  let t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.innerHTML = '<span>' + esc(msg) + '</span>' + (opts.undo ? '<button type="button">Undo</button>' : '');
  t.classList.remove('hidden');
  if (opts.undo) t.querySelector('button').onclick = () => { opts.undo(); hideToast(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, opts.ms || 5000);
}
function hideToast() { const t = $('#toast'); if (t) t.classList.add('hidden'); }

function confirmBox(title, text, okLabel, onOk, opts) {
  opts = opts || {};
  const m = openModal(
    '<h2>' + esc(title) + '</h2><p class="muted">' + esc(text) + '</p>' + (opts.extra || '') +
    '<div class="btns"><button class="btn" type="button" data-x="no">Cancel</button>' +
    '<button class="btn ' + (opts.danger ? 'danger' : 'primary') + '" type="button" data-x="ok">' + esc(okLabel) + '</button></div>',
    { cls: 'center', name: 'confirm' });
  m.sheet.addEventListener('click', (e) => {
    const b = e.target.closest('[data-x]');
    if (!b) return;
    if (b.dataset.x === 'ok') { const extra = opts.read ? opts.read(m.sheet) : null; closeModal(m); onOk(extra); }
    else closeModal(m);
  });
  return m;
}

const ui = { view: 'home', month: thisMonth(), filter: 'all', q: '', planTab: 'budgets', loanId: '' };
let renderQueued = false;
function requestRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}

const chev = (dir) => '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + (dir < 0 ? 'M15 5l-7 7 7 7' : 'M9 5l7 7-7 7') + '"/></svg>';
const monthSwitcher = () => '<div class="month"><button type="button" data-act="month" data-d="-1" aria-label="Previous month">' + chev(-1) +
  '</button><button type="button" class="label" data-act="month" data-d="0">' + esc(fmonth(ui.month)) +
  '</button><button type="button" data-act="month" data-d="1" aria-label="Next month">' + chev(1) + '</button></div>';
function figureHTML(c) {
  const s = usd(c); const i = s.lastIndexOf('.');
  // Wide banknote numerals: shrink long figures so they never overflow the note.
  const n = s.slice(0, i).length;
  const scale = n <= 5 ? 1 : n === 6 ? 0.86 : n === 7 ? 0.76 : n === 8 ? 0.68 : 0.58;
  return '<span style="font-size:' + scale + 'em"><span>' + s.slice(0, i) + '</span><span class="c">' + s.slice(i) + '</span></span>';
}
const tag = (status) => '<span class="tag ' + status + '">' + ({ confirmed: 'Confirmed', estimated: 'Estimated', unknown: 'Unknown' })[status] + '</span>';

function render() {
  updatePill();
  if (!meta.url) { renderConnect(); return; }
  $('#app').classList.remove('hidden');
  const cn = $('#connect'); if (cn) cn.remove();
  const titles = { home: 'Home', activity: 'Activity', plan: 'Plan', accounts: 'Accounts' };
  $('#title').textContent = titles[ui.view];
  $$('.tab').forEach((b) => { if (b.dataset.view === ui.view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  // Keep focus and caret in an input that survives the re-render.
  const ae = document.activeElement;
  const keep = ae && ae.id && $('#main').contains(ae) ? { id: ae.id, s: ae.selectionStart, e: ae.selectionEnd } : null;
  const main = $('#main');
  const html = ({ home: viewHome, activity: viewActivity, plan: viewPlan, accounts: viewAccounts })[ui.view]();
  main.innerHTML = html;
  if (keep) { const el = document.getElementById(keep.id); if (el) { el.focus(); try { el.setSelectionRange(keep.s, keep.e); } catch (e) { /* not a text input */ } } }
  for (const m of stack) if (m.refresh) m.refresh();
}

function go(view) {
  if (ui.view !== view) { ui.view = view; window.scrollTo(0, 0); }
  render();
  $('#main').classList.remove('view-enter'); void $('#main').offsetWidth; $('#main').classList.add('view-enter');
}

function updatePill() {
  const p = $('#pill'); if (!p) return;
  const n = pending();
  let state = 'ok', text = 'Synced';
  if (!navigator.onLine || meta.error === 'offline') { state = 'offline'; text = 'Offline'; }
  else if (busy) { state = 'syncing'; text = 'Syncing'; }
  else if (meta.error) { state = 'error'; text = 'Sync issue'; }
  else if (n) { state = 'waiting'; text = n + ' waiting'; }
  p.dataset.state = state;
  $('#pilltext').textContent = text;
}

    (s.noBudgets ? '<div class="nudge">No budgets set yet. <button type="button" data-act="go" data-view="plan" data-tab="budgets">Set monthly budgets</button> to see what is free to spend.</div>' : '') +
    '</section>';
  h += '<dl class="flows"><div><dt>Money in</dt><dd>' + usd(s.income) + '</dd></div><div><dt>Money out</dt><dd>' + usd(s.spent) + '</dd></div><div><dt>Saved</dt><dd>' + usd(s.saved) + '</dd></div></dl>';

  // Due soon: next 7 days plus anything overdue.
  if (s.state === 'current') {
    const t = today(), horizon = addDays(t, 7);
    const due = [];
    for (const rec of D.recurring) for (const d of undone(rec, horizon)) if (!rec.auto || d > t) due.push({ rec, d });
    due.sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : 0));
    if (due.length) {
      h += '<h2>Due soon</h2><ul class="list" id="due-soon">' + due.map(({ rec, d }) => {
        const when = d < t ? 'Overdue since ' + fd(d) : d === t ? 'Due today' : 'Due ' + fdSmart(d).replace('Tomorrow', 'tomorrow');
        const acts = rec.auto ? '<span class="s">Logs automatically</span>' :
          '<span class="acts"><button class="btn small" type="button" data-act="paid" data-id="' + esc(rec.id) + '" data-d="' + d + '">' + (rec.type === 'income' ? 'Received' : 'Paid') +
          '</button><button class="btn small" type="button" data-act="skip" data-id="' + esc(rec.id) + '" data-d="' + d + '">Skip</button></span>';
        return '<li class="row"><span class="main"><span class="t" style="display:block">' + esc(rec.name) + '</span><span class="s' + (d < t ? ' left-warn' : '') + '">' + esc(when) + ', ' +
          (rec.type === 'income' ? '+' : '') + usd(toCents(rec.amount)) + '</span></span>' + acts + '</li>';
      }).join('') + '</ul>';
    }
  }

  // One quiet loan row, no second hero.
  if (meta.hasLoans && D.loans.length) {
    const L = D.loans[0], c = loanCalc(L), cat = D.catByName[L.category];
    const planned = cat && isNum(cat.budget) ? toCents(cat.budget) : 0;
    const paid = (s.byCat[L.category] || 0);
    const line = planned > 0 ? usd(planned) + ' planned this month' + (paid ? ', ' + usd(paid) + ' paid' : '') : paid ? usd(paid) + ' paid this month' : 'No payment planned';
    h += '<h2>Debt</h2><ul class="list"><li><button type="button" class="row" data-act="go" data-view="plan" data-tab="debt" id="home-loan"><span class="ic" aria-hidden="true">🎓</span><span class="main"><span class="t" style="display:block">' +
      esc(L.name) + '</span><span class="s">' + esc(line) + '</span></span><span class="end">' +
      (c.monthly != null ? '<span class="amt est">' + inr(c.monthly) + '</span><span class="s" style="display:block">Estimated interest a month</span>' : '<span class="unk">Interest unknown</span>') +
      '</span></button></li></ul>';
  }

  // Budget bars.
  const budgeted = D.cats.filter((c) => c.kind === 'expense' && isNum(c.budget) && c.budget > 0);
  if (budgeted.length) {
    h += '<h2>Budgets</h2><ul class="list">' + budgeted.map((c) => {
      const b = toCents(c.budget), sp = s.byCat[c.name] || 0, r = sp / b;
      const cls = r > 1 ? 'over' : r >= 0.85 ? 'warn' : '';
      const left = b - sp;
      return '<li class="row"><span class="ic" aria-hidden="true">' + esc(c.icon || '📦') + '</span><span class="main"><span style="display:flex;justify-content:space-between;gap:8px"><span class="t">' + esc(c.name) +
        '</span><span class="num s ' + (cls ? 'left-' + cls : '') + '">' + (left >= 0 ? usd(left) + ' left' : usd(-left) + ' over') + '</span></span>' +
        '<span class="bar ' + cls + '"><i style="width:' + Math.min(100, Math.round(r * 100)) + '%"></i></span><span class="s num">' + usd(sp) + ' of ' + usd(b) + '</span></span></li>';
    }).join('') + '</ul>';
  }

  const recent = s.txns.slice(0, 5);
  h += '<div class="section-head"><h2>Latest entries</h2>' + (s.txns.length > 5 ? '<button class="link" type="button" data-act="go" data-view="activity">See all</button>' : '') + '</div>';
  h += recent.length ? '<ul class="list" id="recent">' + recent.map((r) => txnRow(r, true)).join('') + '</ul>' :
    '<div class="empty">Nothing logged in ' + esc(fmonth(ui.month)) + ' yet. Tap the green coin to add an expense.</div>';
  return h;
}

/* ---------------- Activity ---------------- */

const FILTERS = [['all', 'All'], ['expense', 'Spending'], ['income', 'Income'], ['transfer', 'Transfers'], ['save', 'Savings']];
function viewActivity() {
  return monthSwitcher() +
    '<input class="search" id="q" type="search" placeholder="Search notes, categories, amounts" aria-label="Search" value="' + esc(ui.q) + '" autocomplete="off">' +
    '<div class="filters" role="group" aria-label="Filter">' + FILTERS.map(([k, l]) => '<button type="button" data-act="filter" data-f="' + k + '" aria-pressed="' + (ui.filter === k) + '">' + l + '</button>').join('') + '</div>' +
    '<div id="list">' + activityList() + '</div>';
}
function activityList() {
  const D = derive();
  const q = ui.q.trim().toLowerCase();
  const rows = D.txns.filter((r) => {
    if (r.date.slice(0, 7) !== ui.month) return false;
    if (ui.filter !== 'all' && r.type !== ui.filter) return false;
    if (!q) return true;
    const hay = [r.category, r.note, r.account, r.toAccount, r.goal, (toCents(r.amount) / 100).toFixed(2)].join(' ').toLowerCase();
    return hay.indexOf(q) >= 0;
  });
  if (!rows.length) return '<div class="empty">' + (q || ui.filter !== 'all' ? 'No entries match.' : 'Nothing logged in ' + esc(fmonth(ui.month)) + '.') + '</div>';
  let h = '', day = '';
  for (const r of rows) {
    if (r.date !== day) {
      if (day) h += '</ul>';
      day = r.date;
      const spend = rows.filter((x) => x.date === day && x.type === 'expense').reduce((a, x) => a + toCents(x.amount), 0);
      h += '<div class="dayhead"><span>' + esc(DF.day.format(toUTC(day))) + '</span><span class="daytot">' + (spend ? usd(-spend) : '') + '</span></div><ul class="list" style="border-top:0">';
    }
    h += txnRow(r, false);
  }
  return h + '</ul>';
}

/* ---------------- Plan ---------------- */

function viewPlan() {
  const tabs = [['budgets', 'Budgets'], ['recurring', 'Recurring'], ['goals', 'Goals'], ['debt', 'Debt']];
  let h = '<div class="seg" role="tablist" style="margin:4px 0 6px">' + tabs.map(([k, l]) => '<button type="button" role="tab" data-act="plantab" data-tab="' + k + '" aria-pressed="' + (ui.planTab === k) + '" aria-selected="' + (ui.planTab === k) + '">' + l + '</button>').join('') + '</div>';
  h += ({ budgets: planBudgets, recurring: planRecurring, goals: planGoals, debt: planDebt })[ui.planTab]();
  return h;
}

function planBudgets() {
  const D = derive();
  const expInc = D.recurring.filter((r) => r.type === 'income').reduce((s, r) => s + monthlyEquivalent(r), 0);
  const total = D.cats.filter((c) => c.kind === 'expense' && isNum(c.budget) && c.budget > 0).reduce((s, c) => s + toCents(c.budget), 0);
  const gap = Math.round(expInc - total);
  let h = '<ul class="list" style="margin-top:12px"><li class="row"><span class="main">Expected income a month<span class="s" style="display:block">From recurring income</span></span><span class="amt" id="exp-income">' + usd(Math.round(expInc)) + '</span></li>' +
    '<li class="row"><span class="main">Total budgeted</span><span class="amt" id="total-budgeted">' + usd(total) + '</span></li>' +
    '<li class="row"><span class="main">' + (gap >= 0 ? 'Not yet budgeted' : 'Budgeted beyond income') + '</span><span class="amt ' + (gap < 0 ? 'left-over' : '') + '" id="budget-gap">' + usd(Math.abs(gap)) + '</span></li></ul>';
  h += '<p class="note-line">One monthly number per category. It applies to every month, past months included.</p>';
  const list = (kind) => D.cats.filter((c) => c.kind === kind).map((c) => '<li><button type="button" class="row" data-act="edit-cat" data-id="' + esc(c.id) + '"><span class="ic" aria-hidden="true">' + esc(c.icon || '📦') +
    '</span><span class="main t">' + esc(c.name) + '</span><span class="end">' + (kind === 'expense' ? (isNum(c.budget) && c.budget > 0 ? '<span class="amt">' + usd(toCents(c.budget)) + '</span>' : '<span class="muted">No budget</span>') : '') + '</span></button></li>').join('');
  h += '<h2>Spending categories</h2><ul class="list">' + list('expense') + '</ul>';
  h += '<h2>Income categories</h2><ul class="list">' + list('income') + '</ul>';
  h += '<div class="btns"><button class="btn" type="button" data-act="new-cat">Add category</button></div>';
  return h;
}

function recSummary(rec) {
  const a = rec.anchor;
  let when = FREQ_LABEL[rec.freq];
  if (rec.freq === 'monthly') when = 'Monthly on the ' + ordinal(Number(a.slice(8, 10)));
  else if (rec.freq === 'yearly') when = 'Yearly on ' + fd(a);
  else when += ' from ' + fd(a);
  const nd = nextDue(rec);
  return when + (nd ? ', next ' + fdSmart(nd) : '') + (rec.auto ? ', logs automatically' : '');
}
function planRecurring() {
  const D = derive();
  const group = (type, title) => {
    const list = D.recurring.filter((r) => r.type === type);
    return '<h2>' + title + '</h2>' + (list.length ? '<ul class="list">' + list.map((r) => '<li><button type="button" class="row" data-act="edit-rec" data-id="' + esc(r.id) + '"><span class="main"><span class="t" style="display:block">' + esc(r.name) +
      '</span><span class="s">' + esc(recSummary(r)) + '</span></span><span class="end">' + (type === 'income' ? '<span class="amt in">+' + usd(toCents(r.amount)) + '</span>' : '<span class="amt">' + usd(toCents(r.amount)) + '</span>') + '</span></button></li>').join('') + '</ul>' :
      '<div class="empty">None yet.</div>');
  };
  return group('expense', 'Bills') + group('income', 'Income') + '<div class="btns"><button class="btn" type="button" data-act="new-rec">Add recurring item</button></div>';
}

function planGoals() {
  const D = derive();
  const mk = thisMonth();
  let h = '<h2>Savings goals</h2>';
  if (!D.goals.length) h += '<div class="empty">No goals yet.</div>';
  else h += '<ul class="list">' + D.goals.map((g) => {
    const saved = D.goalSaved[g.name] || 0, target = toCents(g.target);
    const r = target > 0 ? saved / target : 0;
    let need = '';
    if (target > 0 && saved >= target) need = 'Reached';
    else if (isDate(g.targetDate) && target > 0) {
      const months = Math.max(1, monthsBetween(mk, g.targetDate.slice(0, 7)));
      need = g.targetDate.slice(0, 7) < mk ? 'Target date has passed' : 'Needs ' + usd(Math.ceil((target - saved) / months)) + ' a month to reach by ' + DF.mon.format(toUTC(g.targetDate));
    }
    return '<li class="row" style="flex-wrap:wrap"><span class="ic" aria-hidden="true">' + esc(g.icon || '🎯') + '</span><button type="button" class="main" style="background:none;border:0;padding:0;text-align:left" data-act="edit-goal" data-id="' + esc(g.id) + '"><span class="t" style="display:block">' + esc(g.name) +
      '</span><span class="s num" data-goal-saved="' + esc(g.name) + '">' + usd(saved) + ' of ' + usd(target) + '</span><span class="bar"><i style="width:' + Math.max(0, Math.min(100, Math.round(r * 100))) + '%"></i></span><span class="s">' + esc(need) + '</span></button>' +
      '<span class="acts"><button class="btn small" type="button" data-act="goal-add" data-id="' + esc(g.id) + '">Add</button><button class="btn small" type="button" data-act="goal-out" data-id="' + esc(g.id) + '">Take out</button></span></li>';
  }).join('') + '</ul>';
  return h + '<div class="btns"><button class="btn" type="button" data-act="new-goal">Add goal</button></div>';
}

/* ---------------- Plan > Debt ---------------- */

function snapRow(label, value, status, sub, id) {
  return '<li class="row snap"' + (id ? ' id="' + id + '"' : '') + '><span class="main"><span class="t" style="display:block;white-space:normal">' + esc(label) + '</span>' + (sub ? '<span class="s wrap" style="display:block">' + sub + '</span>' : '') +
    '</span><span class="end"><span class="amt ' + (status === 'estimated' ? 'est' : status === 'unknown' ? 'unk' : '') + '">' + value + '</span>' + (status ? tag(status) : '') + '</span></li>';
}
function planRow(label, value, sub, act, id) {
  const inner = '<span class="main"><span class="t" style="display:block;white-space:normal">' + esc(label) + '</span>' + (sub ? '<span class="s wrap" style="display:block">' + sub + '</span>' : '') + '</span><span class="end"><span class="amt">' + value + '</span>' +
    (act ? '<span class="s" style="display:block;color:var(--pos)">Change</span>' : '') + '</span>';
  return act ? '<li><button type="button" class="row" data-act="' + act + '"' + (id ? ' id="' + id + '"' : '') + '>' + inner + '</button></li>' : '<li class="row"' + (id ? ' id="' + id + '"' : '') + '>' + inner + '</li>';
}

function planDebt() {
  const D = derive();
  if (!meta.hasLoans) {
    return '<h2>Debt</h2><p class="note-line" id="debt-update">Update the script to enable Debt. Paste the new Code.gs into Apps Script, run setup once, then use Deploy > Manage deployments > Edit > New version. The rest of the app works as before.</p>';
  }
  if (!D.loans.length) return '<h2>Debt</h2><div class="empty">No loans in the Sheet. Run setup in Apps Script to add the education loan, or add a row to the Loans tab.</div>';
  let L = D.loans.find((l) => l.id === ui.loanId) || D.loans[0];
  const c = loanCalc(L);
  const p = loanPlan(L, c);
  let h = '';
  if (D.loans.length > 1) h += '<div class="filters">' + D.loans.map((l) => '<button type="button" data-act="pick-loan" data-id="' + esc(l.id) + '" aria-pressed="' + (l.id === L.id) + '">' + esc(l.name) + '</button>').join('') + '</div>';

  // 1. Snapshot
  const lv = isDate(L.lastVerified) ? fd(L.lastVerified, 'full') : 'Never';
  h += '<div class="section-head"><h2>' + esc(L.name) + '</h2></div><p class="note-line" style="margin-top:0">' + esc(L.lender || '') + (L.lender ? '. ' : '') +
    'Last verified with bank: <strong id="last-verified">' + esc(lv) + '</strong></p><ul class="list" id="snapshot">';
  h += snapRow('Outstanding principal', inr(c.principal.v), c.principal.status,
    c.principal.status === 'confirmed' ? 'From the bank, as of ' + esc(lv) : 'Disbursed ' + inr(c.disbursed) + (c.principalPaid ? ', less ' + inr(c.principalPaid) + ' principal repaid' : '') + '. Whether any interest was capitalised is not known.', 'snap-principal');
  if (c.accrued.status === 'confirmed') {
    h += snapRow('Accrued interest', inr(c.accrued.v), 'confirmed', 'As of ' + esc(lv) + (c.accrued.since ? '. About ' + inr(c.accrued.since) + ' more since then (estimated).' : ''), 'snap-accrued');
  } else if (c.accrued.status === 'estimated') {
    h += snapRow('Accrued interest', inr(c.accrued.v), 'estimated', 'From the rates entered since the first disbursement, simple interest', 'snap-accrued');
  } else {
    h += snapRow('Accrued interest', 'Unknown', 'unknown', 'Cannot be reconstructed' + (c.accrued.coverage ? ': no rate is entered before ' + esc(fd(c.accrued.coverage, 'full')) : ': no rates entered') +
      '. Confirm with PNB.' + (c.accrued.partial ? ' About ' + inr(c.accrued.partial) + ' since then (estimated).' : ''), 'snap-accrued');
  }
  if (c.total.status === 'unknown') h += snapRow('Total outstanding', 'Unknown', 'unknown', 'At least ' + inr(c.total.atLeast) + ', plus interest not yet known. Confirm with PNB.', 'snap-total');
  else h += snapRow('Total outstanding', inr(c.total.v), c.total.status, c.total.status === 'confirmed' ? 'From the bank, as of ' + esc(lv) : 'Principal plus estimated interest', 'snap-total');
  if (c.rate) h += snapRow('Current rate of interest', pct(c.rate.rate), c.rate.status, 'Since ' + esc(fd(c.rate.date, 'full')) + (c.rate.source ? ', ' + esc(c.rate.source) : ''), 'snap-roi');
  else h += snapRow('Current rate of interest', 'Unknown', 'unknown', 'Confirm with PNB', 'snap-roi');
  if (c.monthly != null) {
    h += snapRow('Monthly interest', inr(c.monthly), 'estimated', 'Principal times rate, divided by 12' + (c.fx ? '. About ' + usd(Math.round(c.monthly / c.fx)) + ' at your planning rate' : ''), 'snap-monthly');
  } else h += snapRow('Monthly interest', 'Unknown', 'unknown', 'Needs a rate', 'snap-monthly');
  h += isDate(L.moratoriumEnd) ? snapRow('Moratorium end', esc(fd(L.moratoriumEnd, 'full')), 'confirmed', '', 'snap-mor') : snapRow('Moratorium end', 'Unknown', 'unknown', 'Confirm with PNB', 'snap-mor');
  h += isDate(L.emiStart) ? snapRow('Expected EMI start', esc(fd(L.emiStart, 'full')), 'confirmed', '', 'snap-emistart') : snapRow('Expected EMI start', 'Unknown', 'unknown', 'Confirm with PNB', 'snap-emistart');
  h += isNum(L.emi) ? snapRow('Original indicative EMI', inr(paise(L.emi)), 'confirmed', 'From the sanction letter. The actual EMI is not known yet.', 'snap-emi') : snapRow('Original indicative EMI', 'Unknown', 'unknown', '', 'snap-emi');
  if (isNum(L.tenure) && L.tenure > 0) {
    h += snapRow('Tenure', plural(L.tenure, 'month'), 'confirmed', isDate(L.emiStart) ? 'As sanctioned. Ends around ' + esc(DF.mon.format(toUTC(addMonthsToDate(L.emiStart, L.tenure - 1)))) : 'As sanctioned, counted from EMI start. Remaining tenure is not known until EMI start is.', 'snap-tenure');
  } else h += snapRow('Tenure', 'Unknown', 'unknown', '', 'snap-tenure');
  h += '</ul><div class="btns"><button class="btn" type="button" data-act="loan-statement">Enter figures from a bank statement</button></div>';

  // 2. This month's plan
  h += '<h2>This month\'s plan</h2><ul class="list" id="loan-plan">';
  h += planRow('Income this month', usd(p.income), 'Received ' + usd(p.received) + (p.expected ? ', ' + usd(p.expected) + ' more expected' : ''), '', 'lp-income');
  h += planRow('Planned spending', usd(p.planned), 'Budgets, or actual spending where it is higher', '', 'lp-spending');
  h += planRow('Bills still due', usd(p.billsOutside), 'Bills not already counted in a budget', '', 'lp-bills');
  if (p.saved) h += planRow('Saved to goals', usd(p.saved), '', '', 'lp-saved');
  h += planRow('Loan payment planned', p.loanPlanned ? usd(p.loanPlanned) : 'Not set', 'Your ' + esc(L.category) + ' budget' + (p.loanPaid ? '. Paid so far ' + usd(p.loanPaid) : ''), 'loan-planned', 'lp-planned');
  h += planRow('Projected left this month', '<span class="' + (p.left < 0 ? 'left-over' : '') + '">' + usd(p.left) + '</span>', 'Income less all of the above', '', 'lp-left');
  h += planRow('Cash now', usd(p.cash), 'Bank, cash and wallet balances, less card balances owed', '', 'lp-cash');
  h += planRow('Projected cash at month end', usd(p.cashEnd), '', '', 'lp-cashend');
  h += planRow('Minimum cash buffer', p.buffer == null ? 'Not set' : usd(p.buffer), 'The least cash you want to keep', 'loan-buffer', 'lp-buffer');
  if (p.above != null) h += planRow(p.above >= 0 ? 'Available above buffer' : 'Below cash buffer by', '<span class="' + (p.above < 0 ? 'left-warn' : '') + '">' + usd(Math.abs(p.above)) + '</span>', '', '', 'lp-above');
  h += planRow('Planning exchange rate', c.fx ? inr(Math.round(c.fx * 100)) + ' per $1' : 'Not set', 'Used only to estimate future payments', 'loan-fx', 'lp-fx');
  h += '</ul>';

  // Scenarios
  const notes = [];
  if (!c.fx) notes.push('Set a planning rate to see rupee estimates.');
  if (c.rate && c.rate.status === 'estimated') notes.push('Interest figures use the estimated ' + pct(c.rate.rate) + ' rate.');
  if (!c.rate) notes.push('Interest is unknown until a rate is entered.');
  notes.push(c.lastFee != null ? 'Totals include a ' + usd(c.lastFee) + ' fee, as on your last payment.' : 'Totals exclude transfer fees.');
  h += '<h3>Payment scenarios</h3><p class="note-line">Each one is this month with that total paid toward the loan' + (p.loanPaid ? ', including the ' + usd(p.loanPaid) + ' already paid' : '') + '. ' + notes.join(' ') + ' Tap one to make it your plan.</p><ul class="list" id="scenarios">';
  for (const s of p.scenarios) {
    const lines = [];
    if (s.inr != null) lines.push('About ' + inr(s.inr) + ' sent (estimated)');
    if (s.cover != null) {
      lines.push(s.cover >= 1 ? 'Covers estimated interest' : 'Covers ' + Math.floor(s.cover * 100) + '% of estimated interest');
      if (s.growth > 0) lines.push('Estimated loan balance still increases by ' + inr(s.growth) + ' this month');
      else lines.push('About ' + inr(-s.growth) + ' more than estimated interest');
    }
    lines.push((s.left >= 0 ? 'Leaves ' + usd(s.left) + ' this month' : usd(-s.left) + ' short this month') + ', ' + usd(s.cashEnd) + ' cash at month end');
    h += '<li><button type="button" class="row" data-act="scenario" data-usd="' + s.usd + '" data-amount="' + s.usd + '"><span class="main"><span class="t" style="display:block">' + usdShort(s.usd) + (s.label ? ', ' + esc(s.label.toLowerCase()) : '') + (s.current ? ', your current plan' : '') + '</span>' +
      lines.map((x) => '<span class="s wrap" style="display:block">' + esc(x) + '</span>').join('') + '</span><span class="end"><span class="amt">' + usd(s.total) + '</span>' + (s.below ? '<span class="tag warn">Below cash buffer</span>' : '') + '</span></button></li>';
  }
  h += '</ul>';

  // 3. Payment history
  h += '<div class="section-head"><h2>Payments</h2><button class="link" type="button" data-act="loan-pay">Record a payment</button></div><ul class="list" id="loan-payments">';
  if (!c.pays.length) h += '<li class="empty">No payments recorded yet.</li>';
  for (const pay of c.pays) {
    const link = paymentLink(pay);
    const fee = isNum(pay.fee) ? toCents(pay.fee) : 0;
    const subs = [];
    subs.push((pay.provider ? pay.provider + ', ' : '') + 'sent ' + usd(toCents(pay.usd)) + (fee ? ' plus ' + usd(fee) + ' fee (' + (toCents(pay.usd) ? (fee / toCents(pay.usd) * 100).toFixed(1) : '0') + '%)' : ', no fee'));
    if (isNum(pay.fx)) subs.push('Provider rate ' + inr(Math.round(pay.fx * 100)) + ' per $1');
    if (isNum(pay.inr)) subs.push('Received ' + inr(paise(pay.inr)) + ', effective ' + inr(Math.round(paise(pay.inr) / link.total * 100)) + ' per $1');
    else subs.push('INR received not entered');
    if (isNum(pay.inrApplied)) subs.push('PNB applied ' + inr(paise(pay.inrApplied)));

    else subs.push('Split between interest and principal not known yet');

    if (pay.note) subs.push(pay.note);
    h += '<li><button type="button" class="row" data-act="edit-pay" data-id="' + esc(pay.id) + '"><span class="main"><span class="t" style="display:block">' + esc(fd(pay.date, 'full')) + '</span>' +
      subs.map((x) => '<span class="s wrap" style="display:block">' + esc(x) + '</span>').join('') + (link.problem ? '<span class="flag" style="display:block">' + esc(link.problem) + '</span>' : '') +
      '</span><span class="end"><span class="amt">' + usd(link.total) + '</span><span class="s" style="display:block">' + (isNum(pay.inr) ? inr(paise(pay.inr)) : '') + '</span>' + tag(pay.confirmed ? 'confirmed' : 'unknown').replace('Unknown', 'Not confirmed') + '</span></button></li>';
  }
  h += '</ul>';

  // 4. Bank questions
  const qs = D.questions.filter((q) => q.loan === L.name);
  const open = qs.filter((q) => !q.resolved).length;
  h += '<h2>Questions for the bank</h2><p class="note-line" style="margin-top:0">' + (open ? plural(open, 'question') + ' still open.' : 'All answered.') + '</p><ul class="list" id="questions">' +
    qs.map((q) => '<li><button type="button" class="row" data-act="question" data-id="' + esc(q.id) + '"><span class="check' + (q.resolved ? ' on' : '') + '" aria-hidden="true"></span><span class="main"><span class="t wrap" style="display:block;white-space:normal">' + esc(q.question) +
      '</span>' + (q.resolved ? '<span class="s wrap" style="display:block">Answered' + (isDate(q.resolvedOn) ? ' ' + esc(fd(q.resolvedOn, 'full')) : '') + (q.answer ? ': ' + esc(q.answer) : '') + '</span>' : '') +
      '</span><span class="sr">' + (q.resolved ? 'Resolved' : 'Open') + '</span></button></li>').join('') + '</ul>';
  h += '<div class="btns"><button class="btn" type="button" data-act="loan-details">Edit loan details</button></div>';
  return h;
}
